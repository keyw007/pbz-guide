<style>:root{--bg:#101318;--panel:#1a2028;--panel2:#202832;--fg:#f0ece5;--muted:#a7b0bb;--gold:#d7ac72;--line:#323d48;--red:#ef9a9a;--green:#92d3af;--blue:#8fb8e8;--boss:#c47a6a}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--fg);line-height:1.65}
button,input,select{font:inherit;color:inherit}a{color:#e5bb87}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:#141a21;border-right:1px solid var(--line);padding:20px 16px}
.brand{font-size:22px;font-weight:800;letter-spacing:1px;color:var(--gold)}

nav button .pc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
nav button.done .pc{color:var(--green)}
main{min-width:0}
.wrap{max-width:980px;margin:auto;padding:26px 28px 90px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.toolbar input{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 13px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip.on{background:#3a2e22;border-color:#a37b4f;color:#f5dcb9}
h1{font-size:30px;margin:6px 0 4px;line-height:1.25}
.kicker{color:var(--gold);letter-spacing:2px;font-size:12px}
.intro{color:#c9d0d6}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9b7446,#d7ac72)}

.p{margin:8px 0;color:#d6dbe0}

.step{background:#161c23}
.pt{background:var(--panel);border:1px solid transparent}
.pt.miss{border-color:#6e4b3b}
.pt.ok,.step.ok{opacity:.45}

input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:#c99a5f;cursor:pointer}

.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.ty.t-Boss,.ty.t-武器,.ty.t-影之武裝{background:#3b2a27;color:#f1c4b5}
.ty.t-鈴鐺{background:#2a3140;color:#c3d4f0}
.ty.t-記憶之花{background:#33283b;color:#e2c9f0}
.ty.t-支線{background:#2c3a2f;color:#bfe3c8}
.ty.t-寶藏,.ty.t-殺氣琥珀,.ty.t-黑石碎片{background:#3a3424;color:#eedca8}
.badge{font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid}
.b-miss{border-color:#a3664b;color:#f0b495}.b-chest{border-color:#7d6a45;color:#e6cf9a}.b-q{border-color:#4c7a5d;color:#a9dcbb;cursor:pointer}
.nm{font-weight:600;color:#efe0c0}
.hint{color:#d6dbe0;margin-top:2px}
.en{font-size:12px;color:#8c96a1}
.en a{color:#8c96a1}

.boss .bn{font-weight:800;font-size:17px}
.boss .be{font-size:12px;color:#a99}
.boss .bd{padding:0 14px 14px}
.boss ul{margin:6px 0;padding-left:20px}.boss li{margin:4px 0}
.boss .meta{font-size:13px;color:#d9c3b8}
.boss .src{font-size:12px}
.boss .todo{font-size:12px;color:#c9a28f;font-style:italic}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:17px}
.qcat{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.hidden{display:none!important}
.flash{animation:fl 1.6s ease}@keyframes fl{0%{background:#5a4430}100%{}}
.footer{margin-top:50px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:40px}
.navbtns button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.res{padding:10px 12px;border-radius:9px;background:var(--panel);margin:6px 0;cursor:pointer}.res:hover{background:var(--panel2)}
.res small{color:var(--muted)}
@media(max-width:950px){.app{display:block}.sidebar{height:auto;overflow:visible}.wrap{padding:14px 16px 80px}h1{font-size:24px}nav .grp{display:none}.toolbar{position:static;border:0;padding:0}.chip{padding:5px 10px;font-size:12px}}
@media print{.sidebar,.toolbar,.navbtns{display:none}.app{display:block}.pt,.step{break-inside:avoid}body{background:#fff;color:#000}}

<script>window.GUIDE={"chapters":[{"id":"ch00","title":"序章：物是人非","en":"Prologue","short":"序章","intro":[{"t":"p","s":"基礎教學章。沒有收集品，主要是熟悉操作；開局背包已有三本書（組織、沉思雜記、殺氣改造之謎）。"}],"segs":[{"title":"竹林、庭院與追殺","blocks":[{"t":"step","s":"移動、攀爬與一般攻擊教學","k":"v12:s:ch00:81f942"},{"t":"step","s":"殺氣條：攻擊與招架會消耗殺氣，空了就容易被破防","k":"v12:s:ch00:91336f"},{"t":"step","s":"藍光攻擊＝招架；紅光攻擊＝閃避（全遊戲通用）","k":"v12:s:ch00:0375af"},{"t":"step","s":"少年左殤教學戰（劇情戰）","k":"v12:s:ch00:6ca617"},{"t":"tip","s":"這裡練熟「藍招架、紅閃避」，後面所有 Boss 都靠這個判斷。"},{"t":"step","s":"序章逃亡，抵達悲泣溪谷","k":"v12:s:ch00:e177d2"}]}],"navTitle":"00 序章"},{"id":"ch01","title":"第一章：悲泣溪谷","en":"Weeping Creek Valley","short":"悲泣溪谷","intro":[{"t":"p","s":"主線：逆流而上、鋼鐵巨塔。這章會一口氣接 6 個支線，其中 4 個的截止點在下一章（血色森林）的荊野與白赤練，務必照順序做。"},{"t":"warn","s":"本章接的「見習醫師」在血色森林擊敗荊野時失敗；「清理門戶」「腐敗祕聞」在白赤練前要完成。"}],"segs":[{"title":"起點 → 夫人裂隙 → 破碎傀儡谷","blocks":[{"t":"pts","r":"悲泣溪谷","a":1,"b":12},{"t":"tip","s":"練邪在溪谷驛站提供武器升級，有空先去認識。"}]},{"title":"殘鋼、前哨站與斧老大彭猛","blocks":[{"t":"p","s":"前哨站是本章的支線中樞：老弓手、鍛爐守衛、玉兒都在這裡，之後會多次回來交任務。"},{"t":"pts","r":"悲泣溪谷","a":13,"b":24}]},{"title":"斧主囚室 → 溪谷平原 → 弓手營地","blocks":[{"t":"pts","r":"悲泣溪谷","a":25,"b":33},{"t":"warn","s":"#27 護石、#33 羽弓都是限時：拿到斷弦弓就立刻回前哨站找老弓手修。"}]},{"title":"殺氣塔、新娘阿花與塔頂","blocks":[{"t":"pts","r":"悲泣溪谷","a":34,"b":40},{"t":"tip","s":"#38 的殺氣爐手柄用完要拿回來，#52 塔底還要用一次。"}]},{"title":"追命與鎖鐮回頭收","blocks":[{"t":"p","s":"拿到追命鎖鐮後可以鉤索，回頭把溪谷前段的高處補完。"},{"t":"pts","r":"悲泣溪谷","a":41,"b":55},{"t":"step","s":"第一龍柱挑戰（#46）打不過可以先留著，五根龍柱是真結局條件","k":"v12:s:ch01:8d7413"}]},{"title":"離開溪谷前檢查","blocks":[{"t":"step","s":"見習醫師已交（三種藥草→玉兒，領藥箱）","k":"v12:s:ch01:203c7c"},{"t":"step","s":"清理門戶：羽弓已拿","k":"v12:s:ch01:8dbfb8"},{"t":"step","s":"腐敗祕聞：三名敵人已清並回報","k":"v12:s:ch01:6c7b03"},{"t":"step","s":"血肉花已交玉兒","k":"v12:s:ch01:fe6e3d"},{"t":"step","s":"四凶斧已收第一到第五卷","k":"v12:s:ch01:ecc735"},{"t":"tip","s":"緋紅山莊（#54–55）首訪進不去，等枷籠山拿到傀儡之舌再回來。"}]}],"navTitle":"01 悲泣溪谷"},{"id":"ch02","title":"第二章：血色森林","en":"Crimson Forest","short":"血色森林","intro":[{"t":"p","s":"主線：林中血，鏡中蛇。飛賊營地有 4 個限時支線，全部要在章末白赤練前結算。"},{"t":"warn","s":"荊野（#21）前必須已交完溪谷「見習醫師」。"},{"t":"warn","s":"白赤練（#63）前：清理門戶、腐敗祕聞、盜亦有道、救死扶傷都要完成，白山秘聞要先接。"}],"segs":[{"title":"大橋、花千笑、妙手小張與荊野","blocks":[{"t":"pts","r":"血色森林","a":1,"b":22},{"t":"tip","s":"先把妙手小張的籠子放下（#13），之後他會在營地開店並給寶藏任務。"}]},{"title":"飛賊營地：四傷者、密室與三寶","blocks":[{"t":"pts","r":"血色森林","a":23,"b":42},{"t":"tip","s":"飛賊問答答案：地主玉帶 → 蝴蝶 → 信未寫明命運。"}]},{"title":"鏡林、榕樹與白赤練","blocks":[{"t":"pts","r":"血色森林","a":43,"b":64},{"t":"tip","s":"收齊 6 朵虛空記憶之花，白赤練二階段弦音會助戰。"},{"t":"tip","s":"鏡林龍柱（#49）難度高，可先記著。"}]},{"title":"離開森林前檢查","blocks":[{"t":"step","s":"四個限時支線都已交付","k":"v12:s:ch02:a52cb6"},{"t":"step","s":"妙手小張三寶已交","k":"v12:s:ch02:c31264"},{"t":"step","s":"白山秘聞已接、旅舍密室已對話","k":"v12:s:ch02:9a92f0"}]}],"navTitle":"02 血色森林"},{"id":"ch03","title":"第三章：陸家村","en":"Village of Lu","short":"陸家村","intro":[{"t":"p","s":"主線：失心村。敵人多是人偶，流血武器（殘鋼刃、亡命斬馬刀）效果差，改用破防或鈍器系。"},{"t":"tip","s":"珍妖在陸家村入口附近，可升級飾品。"}],"segs":[{"title":"村口、老根頭、蘭家大少與三人偶","blocks":[{"t":"pts","r":"陸家村","a":1,"b":19},{"t":"tip","s":"拙壁戰後拿到堡壘盾，可以穿箭陣——本章結束後回血色森林用。"}]},{"title":"藍螢寺、廊橋、黑蛇屋與受傷飛賊","blocks":[{"t":"pts","r":"陸家村","a":20,"b":41},{"t":"warn","s":"#41 受傷飛賊：之後要拿血色森林的飛賊手冊來交，拖太久他可能死亡。"}]},{"title":"苦葉寺、機關巨像與倖存者庭院","blocks":[{"t":"pts","r":"陸家村","a":42,"b":59},{"t":"warn","s":"#53 念珠交莊嚴僧時選「不相信」。"}]},{"title":"傀儡坑、玉瓚、沐小葵與碼頭","blocks":[{"t":"pts","r":"陸家村","a":60,"b":70},{"t":"warn","s":"搭升降梯打沐小葵前，五條緞帶要收齊（大小姐／少主）；戰後碼頭 #69–70 要立刻拿，離開就回不去。"}]},{"title":"走私隧道","blocks":[{"t":"pts","r":"陸家村","a":71,"b":73}]},{"title":"回訪：悲泣溪谷與血色森林（進龐鎮前）","blocks":[{"t":"p","s":"現在有堡壘盾，也開啟了「一個不留」，回去補四處："},{"t":"pts","r":"悲泣溪谷","a":56,"b":57},{"t":"pts","r":"血色森林","a":65,"b":68},{"t":"step","s":"飛賊手冊（森林 #68）交陸家村受傷飛賊","k":"v12:s:ch03:a72f12"},{"t":"step","s":"念珠（溪谷 #56）交莊嚴僧，選「不相信」","k":"v12:s:ch03:fbafcd"}]}],"navTitle":"03 陸家村"},{"id":"ch04","title":"第四章：龐鎮","en":"Pangzhen","short":"龐鎮","intro":[{"t":"p","s":"主線：死鎮、心之蹤跡、四大蛇屋。全遊戲最大的區域（108 點），幻鬼酒館是支線中樞。"},{"t":"tip","s":"幻鬼（幻鬼酒館）可替武器鑄魂：每把一次，5,000 意識塵埃＋材料。"},{"t":"tip","s":"建 遇玉兒鈴鐺。"},{"n":8,"type":"飾品","zh":"筋力綁帶","en":"","hint":"初遇玉兒鈴鐺越橋，擊敗正在交戰的持大劍敵人獲取綁帶。","fight":true},{"n":9,"type":"鈴鐺","zh":"紅線屏障","en":"","hint":"靠近巨大紅線屏障，於旁邊小平台開鈴鐺。"},{"n":10,"type":"鈴鐺","zh":"破碎傀儡谷","en":"","hint":"繼續前往屋舍附近小空地，開啟破碎傀儡谷鈴鐺。"},{"n":11,"type":"支線","zh":"四凶斧第一卷","en":"","hint":"撿取傀儡谷鈴鐺旁樹下書籍接四凶斧，再到屋內左側房間拿第一份線索。"},{"n":12,"type":"殺氣琥珀","zh":"殺氣琥珀①","en":"","hint":"打倒維持紅線屏障的敵人，開啟其旁寶箱領取殺氣琥珀。","chest":true},{"n":13,"type":"Boss","zh":"殘鋼／殘鋼刃","en":"","hint":"主線擊敗狂暴巨漢（The Frenzied Brute），獲得其武器。","fight":true},{"n":14,"type":"鈴鐺","zh":"殘鋼亭","en":"","hint":"在狂暴巨漢戰鬥區旁啟動鏽刃亭鈴鐺。"},{"n":15,"type":"殺氣琥珀","zh":"殺氣琥珀②","en":"","hint":"自鏽刃亭上階梯、翻牆；箱堆突襲的敵人掉落殺氣琥珀。"},{"n":16,"type":"鈴鐺","zh":"前哨站庭院、四凶斧第二卷","en":"","hint":"穿過有守衛把守的草地區，啟動前哨站庭院鈴鐺；右側屋內另有四凶斧第二線索。"},{"n":17,"type":"支線","zh":"老弓手委託","en":"","hint":"【限時】到前哨站屋頂找沉思老弓手接「清理門戶」，要在血色森林白赤練前完成。","miss":true},{"n":18,"type":"武器","zh":"長形黑傷","en":"","hint":"前哨站鍛爐正後方武器架取得血色長兵器。"},{"n":19,"type":"支線","zh":"前哨站隱情","en":"","hint":"【限時】走近鍛爐旁守衛並完成對話，接「腐敗祕聞」；白赤練前完成。","miss":true},{"n":20,"type":"鈴鐺","zh":"前哨站","en":"","hint":"鍛爐旁開前哨站鈴鐺，往後多次回來交任務。"},{"n":21,"type":"道具","zh":"黑石①、牢房鑰匙","en":"","hint":"從前哨站鈴鐺直行上樓，到小庭院屍體取得牢房鑰匙；回前哨站入口下坡洞穴開牢門拿黑石。"},{"n":22,"type":"Boss","zh":"斧老大彭猛／巨凶斧","en":"","hint":"擊敗斧老大彭猛，取得巨凶斧；之後可用其破壞障礙。","fight":true},{"n":23,"type":"鈴鐺","zh":"斧主敗亡","en":"","hint":"在彭猛戰鬥場地中央啟動斧主敗亡鈴鐺。"},{"n":24,"type":"殺氣琥珀","zh":"殺氣琥珀③","en":"","hint":"從前哨站鈴鐺破壞近旁柵欄，上階梯進屋清掉敵人取得琥珀；本段三名指定敵人打完後回報隊長。"},{"n":25,"type":"支線","zh":"見習醫師","en":"","hint":"【限時】與前哨站鈴鐺旁玉兒談採藥，接「見習醫師」；一定在血色森林荊野前交三種藥草。","miss":true},{"n":26,"type":"鈴鐺","zh":"斧主囚室、四凶斧第三卷","en":"","hint":"追命過場後在斧主囚室中央啟動鈴鐺；左側桌上有四凶斧第三線索。"},{"n":27,"type":"飾品","zh":"護石","en":"","hint":"【限時】事先在前哨站與箱後 NPC 談到「馬廄旁墳墓」，再從囚室順路調查墳墓取得防禦飾品。","miss":true},{"n":28,"type":"秘藥","zh":"專注藥丸","en":"","hint":"由囚室離開走左岔路，破壞柵欄後開寶箱拿專注藥；回橋下河道拾取止血藤。","chest":true},{"n":29,"type":"鈴鐺","zh":"溪谷平原入口","en":"","hint":"過橋、小門旁開溪谷平原入口鈴鐺。"},{"n":30,"type":"支線","zh":"黑石②、斷弦弓","en":"","hint":"從入口鈴鐺上坡清掉整個弓手營地，取得黑石碎片及斷弦弓。"},{"n":31,"type":"飾品","zh":"追獵信物","en":"","hint":"在弓手營地附近箱子領取追獵信物。","chest":true},{"n":32,"type":"鈴鐺","zh":"無情弓手營地","en":"","hint":"從前項往上階梯啟動無情弓手營地鈴鐺。"},{"n":33,"type":"影之武裝","zh":"羽弓","en":"","hint":"【限時】立刻帶斷弦弓回前哨站找老弓手修復，拿羽弓影之武裝；白赤練前完成。","miss":true},{"n":34,"type":"鈴鐺","zh":"殺氣塔一樓","en":"","hint":"從弓手營地越過大型木橋並上階梯，啟動殺氣塔一樓鈴鐺。"},{"n":35,"type":"Boss","zh":"新娘阿花／紅妝鬼斬","en":"","hint":"自殺氣塔一樓繞到右後方洞口，沿木坡滑下，走左路到盡頭打倒新娘阿花，獲得紅妝鬼斬。","fight":true},{"n":36,"type":"鈴鐺","zh":"血肉花田、雙生血肉花","en":"","hint":"在阿花戰鬥場開啟花田鈴鐺；祭壇旁拾取雙生血肉花，盡快回前哨站交給玉兒。"},{"n":37,"type":"鈴鐺","zh":"殺氣塔頂","en":"","hint":"返回殺氣塔一樓，入塔上階梯，啟動塔頂鈴鐺。"},{"n":38,"type":"支線","zh":"隔絕楔子第一階段","en":"","hint":"與塔頂影衛談話接隔絕楔子；上屋頂、下左梯擊敗敵人取殺氣爐手柄，回一樓啟動殺氣爐取原初石；記得把手柄拿回，再交石給影衛。"},{"n":39,"type":"鈴鐺","zh":"瀑布橋","en":"","hint":"由塔頂往更高處攀爬，落入橋區後啟動瀑布橋鈴鐺。"},{"n":40,"type":"鈴鐺","zh":"大瀑布","en":"","hint":"越過瀑布橋、沿主路前進啟動大瀑布鈴鐺。"},{"n":41,"type":"Boss","zh":"追命／追命鎖鐮","en":"","hint":"主線擊敗追命，取得追命鎖鐮，解鎖鉤索路線。","fight":true},{"n":42,"type":"飾品","zh":"凌然吊墜","en":"","hint":"傳回起點鈴鐺，往序章起始方向退回，使用鎖鐮鉤到高平台開寶箱取飾品。","chest":true},{"n":43,"type":"鈴鐺","zh":"龍柱眺望","en":"","hint":"從塔頂往屋頂再用鎖鐮爬至最高處取營地大門鑰匙；回溪谷平原入口打開大門，走右側到小屋內開龍柱眺望鈴鐺；小屋隊長可交四凶斧第四步。"},{"n":44,"type":"殺氣琥珀","zh":"殺氣琥珀④","en":"","hint":"龍柱眺望鈴鐺後方箱取生鏽龍匙；越橋、過腳手架地上撿凝葉草，開身後鎖門打倒敵人取得殺氣琥珀。","chest":true},{"n":45,"type":"鈴鐺","zh":"悲泣溪谷龍柱","en":"","hint":"從上一處洞穴打碎出口障礙，往前開溪谷龍柱鈴鐺。"},{"n":46,"type":"挑戰","zh":"第一龍柱挑戰前置","en":"","hint":"在龍柱鈴鐺旁啟動龍柱挑戰；首訪可接，打不過可留後期。"},{"n":47,"type":"飾品","zh":"反擊護腕","en":"","hint":"完成龍柱高難度戰鬥取得反擊護腕，請確認獎勵確實入袋。"},{"n":48,"type":"支線","zh":"見習醫師交付","en":"","hint":"從龍柱沿河道到盡頭取瑕金草；與凝葉草、止血藤一起交前哨站玉兒，領「藥箱」飾品，荊野前完成。","miss":true},{"n":49,"type":"黑石碎片","zh":"黑石③","en":"","hint":"從龍柱眺望鈴鐺越橋跳到村落，沿河往北，鉤到木平台開箱取得黑石。","chest":true},{"n":50,"type":"支線","zh":"黑石④、四凶斧第五卷","en":"","hint":"從龍柱眺望鈴鐺返回塔下洞窟，上樓梯擊敗僧人取得黑石；階梯旁桌上有四凶斧第五線索。"},{"n":51,"type":"鈴鐺","zh":"殺氣塔底部","en":"","hint":"沿洞窟向前到殺氣塔底部，啟動鈴鐺。"},{"n":52,"type":"飾品","zh":"反射裝置","en":"","hint":"在殺氣塔底部鈴鐺旁使用前面保留的殺氣爐手柄，取得反射裝置飾品。"},{"n":53,"type":"秘藥","zh":"血脈恢復藥","en":"","hint":"由塔底鈴鐺旁梯子向上，一路走到頂端敵人附近開箱取得回復藥。","chest":true},{"n":54,"type":"鈴鐺","zh":"緋紅山莊","en":"","hint":"回龍柱眺望鈴鐺，旁邊小洞穴內引誘背炸藥敵人炸開中央大鐵籠，乘電梯下降開啟緋紅山莊鈴鐺。"},{"n":55,"type":"鑄魂材料","zh":"古代甲冑碎片","en":"","hint":"緋紅山莊鈴鐺左邊拾取古代甲冑碎片；首訪暫時無法深入。"},{"n":56,"type":"鈴鐺","zh":"夫人洞窟","en":"","hint":"【回訪：抵達陸家村並開啟一個不留支線】前哨站擊敗商店旁僧人取念珠；越過之前被 NPC 擋住的橋，到小鎮左屋破障礙進洞，取得夫人洞窟鈴鐺。"},{"n":57,"type":"支線","zh":"神機戒指／彩色風車","en":"","hint":"由夫人洞窟鈴鐺沿洞前進，出洞後右側寶箱取得神機戒；旁邊風車可拾取彩色風車；鉤上木平台取得四凶斧第六線索。","chest":true},{"n":58,"type":"記憶之花","zh":"緋紅山莊內部","en":"","hint":"【回訪：取得傀儡之舌】緋紅山莊開門，二樓陽台拿記憶之花。"},{"n":59,"type":"鈴鐺","zh":"拾荒者圈養場","en":"","hint":"由山莊一樓一路下降到地下木平台，啟動拾荒傀儡圈養場鈴鐺。"},{"n":60,"type":"Boss","zh":"拾荒傀儡、寒歲","en":"","hint":"擊敗拾荒傀儡及寒歲，取得合金鐮刃鑄魂材料、陽屬傀儡眼及寒歲面具。","fight":true},{"n":61,"type":"鑄魂材料","zh":"虎炮破牆隱藏處","en":"","hint":"【回訪：取得虎炮】從溪谷龍柱鈴鐺炸開附近牆壁，沿山坡到屋內取鑄魂材料。"}]},"血色森林":{"key":"v2:血色森林","points":[{"n":1,"type":"鈴鐺","zh":"","en":"Bell (Crimson Forest)","hint":"劇情過場結束後向正前方走，開啟血色森林鈴鐺。"},{"n":2,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"就在血色森林鈴鐺旁邊，拾取記憶之花。"},{"n":3,"type":"鈴鐺","zh":"","en":"Bell (Abandoned Main Road)","hint":"跨過路障後沿道路邊，啟動荒廢大道鈴鐺。"},{"n":4,"type":"飾品","zh":"","en":"Shieldbreaker Talisman (Accessory)","hint":"跳過斷橋後，在敵人旁的小型腳手架寶箱拿破盾飾品。","chest":true},{"n":5,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"沿主路進洞穴，不走壁跑路線而直接下落，敵人旁拾取黑石。"},{"n":6,"type":"鈴鐺","zh":"","en":"Bell (Pangzhen Bridge Overlook)","hint":"走到巨大橋旁路邊，啟動龐鎮大橋眺望鈴鐺。"},{"n":7,"type":"武器","zh":"癡者殘劍","en":"The Fanatic’s Broken Blade (Weapon)","hint":"主線擊敗劍癡花千笑，獲得殘劍武器。","fight":true},{"n":8,"type":"秘藥","zh":"","en":"Simmering Brew (Medicine)","hint":"大橋坍落後沿橫樑盪越，前方直接拾取秘藥。"},{"n":9,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"沿崖壁進洞穴，右側狗群守著記憶之花。"},{"n":10,"type":"鈴鐺","zh":"","en":"Bell (Trail of Cages)","hint":"繼續穿過洞穴，到崖面開啟囚籠小徑鈴鐺。"},{"n":11,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"遇見妙手小張後進崖邊洞穴，往較低岩台取得記憶之花。"},{"n":12,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"從記憶之花往下走進有毒的水，在箱中拿黑石；毒水會持續傷害，盡速離開。","chest":true},{"n":13,"type":"飾品","zh":"","en":"Cavalrybane (Accessory)","hint":"到洞穴終點先轉動機關把妙手小張囚籠放下；再落到機關旁下層腳手架開箱取騎兵剋星飾品。","chest":true},{"n":14,"type":"鈴鐺","zh":"","en":"Bell (Outlaw Trap)","hint":"從妙手小張處沿崖壁越過洞穴、過橋，避開大敵人，左側開飛賊陷阱鈴鐺。"},{"n":15,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從飛賊陷阱鈴鐺回頭朝騎馬敵人方向，右側拾記憶之花；前面洞穴另取保命符碎片一和隧道手柄。"},{"n":16,"type":"支線","zh":"","en":"Honor Among Thieves (Tale)","hint":"【限時】出洞沿坡向上，擊敗營火旁敵人接「盜亦有道」，須在白赤練前完成。","miss":true},{"n":17,"type":"道具","zh":"","en":"Preservation Jar","hint":"從飛賊陷阱鈴鐺以隧道手柄開洞，走右橋取保命符碎片二，集齊合成保命罐。"},{"n":18,"type":"寶藏","zh":"","en":"Sect Leader’s Snuff Bottle (Treasure)","hint":"從前項沿洞往前，在寶箱取宗主鼻煙壺，屬妙手小張的三寶之一。","chest":true},{"n":19,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"返回洞穴另一邊，過門開寶箱取殺氣琥珀。","chest":true},{"n":20,"type":"秘藥","zh":"","en":"Kuye Dew (Medicine)","hint":"從上一處向下走樓梯，到屍體堆附近取苦葉露。"},{"n":21,"type":"武器","zh":"亡命斬馬刀","en":"Outlaw Warblade (Weapon)","hint":"【截止！】打荊野前回悲泣溪谷交完玉兒見習醫師；之後擊敗荊野取得飛賊斬馬刀。","miss":true,"fight":true},{"n":22,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從荊野戰場向左前進，抵小木橋時從右側往下落，拿記憶之花。"},{"n":23,"type":"支線","zh":"","en":"Secrets of the Baishan Sect (Tale)","hint":"在大木橋上與蘭蘭對話接「白山秘聞」，不要急著向後續主線進發。"},{"n":24,"type":"鈴鐺","zh":"","en":"Bell (Thieves’ Camp)","hint":"越過大木橋，正前方開啟飛賊營地鈴鐺。"},{"n":25,"type":"飾品","zh":"","en":"Silent Wrap (Accessory)","hint":"【限時】向營地溫和飛賊回答三題：地主玉帶、蝴蝶、信未交代其命運；領靜默纏布，白赤練前完成。","miss":true},{"n":26,"type":"支線","zh":"","en":"A Healer’s Mercy (Tale)","hint":"【限時】與飛賊營地鈴鐺旁玉兒談話接「救死扶傷」，白赤練前救好四名傷者並回報。","miss":true},{"n":27,"type":"飾品","zh":"","en":"Quick Hand Pendant (Accessory)","hint":"由飛賊營地沿道路出去、攀牆入小洞找妙手小張；如先前成功放籠可取得妙手吊墜，並開啟商店。"},{"n":28,"type":"支線","zh":"","en":"Quick Hand’s Request (Tale) / The Wily Hare’s Three Dens (Tale)","hint":"與妙手小張再談本地寶藏及其他藏身處，接尋寶相關支線，記得三寶交回兌換武裝。"},{"n":29,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從小張藏身處出來，沿崖壁木棧道走進洞穴，取得記憶之花。"},{"n":30,"type":"寶藏","zh":"","en":"Bloodstained Seal (Treasure)","hint":"繼續向前，左側寶箱取得血染印章（第二寶）。","chest":true}, {"n":17,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"回河道，到石橋正下方拾取記憶之花。"},{"n":18,"type":"鈴鐺","zh":"","en":"Bell (Temple of Blue Fireflies)","hint":"從河道上坡走左路，於寺廟旁開藍螢寺鈴鐺；旁邊樹上收大小姐（少主）緞帶一。"},{"n":19,"type":"支線","zh":"","en":"A Puppet’s Wooden Heart (Tale)","hint":"與小神龕旁歌姬傀儡說話，接「人偶木心」。"},{"n":20,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"右側大型神龕內有記憶之花。"},{"n":21,"type":"秘藥","zh":"","en":"Spirit-Returning Broth (Medicine)","hint":"回三人偶水井鈴鐺，左側上階梯第一個岔路左轉進小院；爬左屋並落到地下室取還魂湯。"},{"n":22,"type":"飾品","zh":"","en":"Mother’s Talisman (Accessory)","hint":"回階梯續向上，頂端房屋內擊敗敵人取得母親護符。","fight":true},{"n":23,"type":"寶藏","zh":"","en":"Wedding Candles (Treasure)","hint":"同一房屋沿梯子上二樓，走到盡頭寶箱取得婚燭，屬小張三寶。","chest":true},{"n":24,"type":"鈴鐺","zh":"","en":"Bell (Covered Bridge)","hint":"從屋舍跳下沿前路，開廊橋鈴鐺。"},{"n":25,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從廊橋鈴鐺穿過身後大門進田野，屋內取得記憶之花。"},{"n":26,"type":"鈴鐺","zh":"","en":"Bell (Zhang’s Hideout, Village of Lu)","hint":"由田野右側跳河，穿過洞穴到妙手小張陸家村藏身處，啟動鈴鐺。"},{"n":27,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"小張藏身處左側破柵欄，擊敗樹旁敵人解廊橋紅線封鎖；樹邊棺木取得黑石。"},{"n":28,"type":"鈴鐺","zh":"","en":"Bell (Black Serpent House)","hint":"通過樹對面的紅神龕區域，再穿房屋，前方開黑蛇屋鈴鐺。"},{"n":29,"type":"秘藥","zh":"","en":"Forbidden Concoction (Medicine)","hint":"從黑蛇屋鈴鐺折返屋內上梯子，在櫃子上取禁藥。"},{"n":30,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"【大小姐（少主）緞帶二】廊橋鈴鐺從解除封鎖的橋走到中段，取綁在柱上的緞帶；過橋在岔路走右，入屋下梯再出去崖邊拾取記憶之花。"},{"n":31,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"在前項同處取得殺氣琥珀。"},{"n":32,"type":"鈴鐺","zh":"","en":"Bell (Statue Grounds Entrance)","hint":"從崖邊回院子上階梯，啟動雕像場入口鈴鐺。"},{"n":33,"type":"武器","zh":"天玄青銅劍","en":"Tianxuan Bronze Sword (Weapon)","hint":"主線擊敗天玄派畢遠掌門殘軀，取得天玄青銅劍。","fight":true},{"n":34,"type":"鈴鐺","zh":"","en":"Bell (The Lady Grounds) / Young Mistress Objective 3","hint":"畢遠戰場內啟動夫人場地鈴鐺；休息後取得第三條緞帶。"},{"n":35,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"夫人場地鈴鐺正旁拾取記憶之花。"},{"n":36,"type":"寶藏","zh":"","en":"Unveiled Statue (Treasure)","hint":"入鈴鐺後方屋舍、上山坡到滿是雕像的場地取得無遮雕像（小張三寶）。"},{"n":37,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從雕像區進下一棟屋，跳到底樓，正前方取得記憶之花。"},{"n":38,"type":"鈴鐺","zh":"","en":"Bell (Smuggler’s Treasure Cellar)","hint":"沿主路過敵群與小門後右轉，上樓梯開走私寶藏地窖鈴鐺。"},{"n":39,"type":"飾品","zh":"","en":"Livingwood Talisman (Accessory)","hint":"從地窖鈴鐺原路返回、跳院子直行，下到另一小區入屋取活木護符。"},{"n":40,"type":"鈴鐺","zh":"","en":"Bell (Smuggler’s Tunnel Entrance)","hint":"從前項進小隧道，跳過木牆繼續往前，到走私隧道入口鈴鐺。"},{"n":41,"type":"飾品","zh":"","en":"Arrowward (Accessory)","hint":"【限時】隧道門旁找受傷飛賊，交「飛賊手冊」得箭矢防護飾品。手冊可回血色森林妙手小張藏身處入口敵人身上取得；務必盡早交，NPC 可能隨進度死亡。","miss":true},{"n":42,"type":"影之武裝","zh":"","en":"Kuye Temple Prayer Beads (Phantom Edge)","hint":"主線擊敗苦葉寺碧海大師殘軀，取得苦葉寺念珠影之武裝。","fight":true},{"n":43,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"碧海戰場中拾取記憶之花。"},{"n":44,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"從戰場沿河往上，在稍上方的寶箱取得黑石。","chest":true},{"n":45,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"沿河走到盡頭，岩石上拾取記憶之花。"},{"n":46,"type":"鈴鐺","zh":"","en":"Bell (Terraces)","hint":"回橋上沿階梯往上，到梯田鈴鐺。"},{"n":47,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"梯田鈴鐺右側建築桌面上取得記憶之花。"},{"n":48,"type":"挑戰","zh":"","en":"Scarecrow (Challenge Location)","hint":"由梯田右屋繼續走，再跳至稻草人位置互動；擊敗炎茹取得其火焰面具。"},{"n":49,"type":"鈴鐺","zh":"","en":"Bell (Engine Giant Remains)","hint":"沿梯田路上行，在巨大建築旁開機關巨像殘骸鈴鐺。"},{"n":50,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從機關巨像鈴鐺進建築，攻擊正在打怪的雕像至倒下，取得記憶之花。"},{"n":51,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從雕像區落洞穴前行，滑索旁取得記憶之花。"},{"n":52,"type":"鈴鐺","zh":"","en":"Bell (Survivors’ Courtyard)","hint":"搭滑索下降清敵後調查附近有人對話的門；進入倖存者院落開鈴鐺。"},{"n":53,"type":"飾品","zh":"","en":"Agarwood Prayer Beads (Accessory)","hint":"【永久分歧】與莊嚴僧人對話務必選「不相信」，交早先前哨站僧人的念珠取沉香念珠；選「相信」NPC 會石化失去獎勵。","miss":true},{"n":54,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"從倖存者院落鈴鐺出來上右側建築，進屋前走左邊平台，在左側箱取得殺氣琥珀。","chest":true},{"n":55,"type":"支線","zh":"","en":"Dahuang (Tale)","hint":"進建築與床上的 NPC 談話，接「大黃」支線；院內紫衣男子亦可交人偶木心的歌姬信。"},{"n":56,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"出屋回庭院下階梯，回頭在洞口旁拾取記憶之花。"},{"n":57,"type":"寶藏","zh":"","en":"White Jade Twins (Treasure)","hint":"從洞口落下，洞內寶箱取得白玉雙子（小張第三寶）。","chest":true},{"n":58,"type":"飾品","zh":"","en":"Fine Thread (Accessory)","hint":"集齊婚燭、無遮雕像、白玉雙子後，返回小張藏身處鈴鐺換取細線飾品。"},{"n":59,"type":"飾品","zh":"","en":"A Puppet’s Wooden Heart (Accessory)","hint":"回機關巨像殘骸鈴鐺，下方篝火旁調查裴的屍體；再到藍螢寺找歌姬傀儡交任務取得人偶木心飾品。"},{"n":60,"type":"鈴鐺","zh":"","en":"Bell (Broken Puppet Pit Entrance)","hint":"收齊藍螢寺相關六朵記憶之花後，從寺內神龕霧門進入，沿路到釣魚者旁開破碎傀儡坑入口鈴鐺。"},{"n":61,"type":"鈴鐺","zh":"","en":"Puppeteer’s Bell (Phantom Edge)","hint":"從釣魚者旁落入深谷，擊敗操偶師暮，取得傀儡師鈴影之武裝。"},{"n":62,"type":"鈴鐺","zh":"","en":"Bell (Broken Puppet Pit Bottom)","hint":"操偶師暮戰場內開破碎傀儡坑底鈴鐺。"},{"n":63,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"回三人偶水井鈴鐺，封鎖解除後下井，落地前方取得記憶之花。"},{"n":64,"type":"鈴鐺","zh":"","en":"Bell (Beneath the Well)","hint":"緊接前項，啟動井底鈴鐺。"},{"n":65,"type":"影之武裝","zh":"","en":"Heartrend Pipa (Phantom Edge)","hint":"從井底鈴鐺進空地，橋柱上收大小姐（少主）第四緞帶；主線擊敗三號樂師傀儡玉瓚，取得斷心琵琶影之武裝。","fight":true},{"n":66,"type":"鈴鐺","zh":"","en":"Bell (Puppet Testing Grounds)","hint":"玉瓚戰鬥場地內開傀儡試驗場鈴鐺。"},{"n":67,"type":"支線","zh":"","en":"Cui (Tale)","hint":"從試驗場與哭泣的小傀儡對話接「小翠」支線；附近左側開地可進夢差幻境傳送門，先進去觸發即可。"},{"n":68,"type":"武器","zh":"妖鋸","en":"Fiend Saws (Weapon) / Fist Fragment: Core (Key Item)","hint":"【限時】上最後升降梯打沐小葵前必須完成大小姐（少主）支線全部緞帶，才能觸發額外第三階段並得到妖鋸與拳之碎片核心。","miss":true},{"n":69,"type":"武器","zh":"亂鶯劍","en":"Wild Oriole Sword (Weapon)","hint":"【不可回頭】打贏沐小葵後，碼頭正前方立即拾取亂鶯劍；離開後升降梯損壞，無法重返。","miss":true},{"n":70,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"【不可回頭】在碼頭左側樹旁寶箱拿殺氣琥珀碎片，確認兩件都拿完才離開。","miss":true,"chest":true},{"n":71,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"回傀儡試驗場鈴鐺進走私隧道，打掉解除紅線障礙的敵人，背後取得黑石；同房桌上拿隧道牢籠鑰匙。"},{"n":72,"type":"鈴鐺","zh":"","en":"Bell (Hidden Passage to Pangzhen)","hint":"穿隧道到階梯，使用牢籠鑰匙打開右門與受困飛賊談話取地窖鑰匙；上樓搭電梯後啟動通往龐鎮祕道鈴鐺。"},{"n":73,"type":"飾品","zh":"","en":"Remnant Spark Cage (Accessory)","hint":"返回走私寶藏地窖鈴鐺，用陸家村地窖鑰匙開門，在地窖寶箱取殘燼籠飾品；老根頭、蘭家大少有新對話記得回去。","chest":true},{"n":74,"type":"鑄魂材料","zh":"","en":"Reinforced Bowstring (Tempering Material) / Serpent Venom Sac: Black","hint":"【回訪：取得烈焰鬃毛】從黑蛇屋鈴鐺燒掉山坡樹枝、入屋左邊取陽龍徽，右側取強化弓弦與黑蛇毒囊；正道大營外門需其鑰匙另行解鎖。"},{"n":75,"type":"鑄魂材料","zh":"","en":"Border Banner (Tempering Material)","hint":"【回訪：取得長棍武裝】蘭家大少藏身處鈴鐺往右，打破地面裂縫後開箱拿邊境旗幟鑄魂材料。","chest":true},{"n":76,"type":"鑄魂材料","zh":"","en":"Border Poems (Tempering Material)","hint":"【回訪：取得虎炮】由龐鎮祕道鈴鐺向右跳下，炸掉牆壁取得邊塞詩篇鑄魂材料。"}]},"龐鎮":{"key":"v2:龐鎮","points":[{"n":1,"type":"鈴鐺","zh":"","en":"Bell (Hidden Storehouse)","hint":"初入龐鎮，隱藏倉庫鈴鐺自動啟用；從此處開始先開路邊鈴鐺再搜尋高低樓層。"},{"n":2,"type":"鈴鐺","zh":"","en":"Bell (Abandoned Wine Cellar)","hint":"從隱藏倉庫鈴鐺穿越室內，直到走到戶外，正前方開啟廢棄酒窖鈴鐺。"},{"n":3,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"從廢棄酒窖沿主線繞過原本鎖住的門，抵達門另一側時在前方拾取黑石碎片。"},{"n":4,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"取得前項後登上屋頂，注意左側矮平台上的寶箱，內有殺氣琥珀碎片。","chest":true},{"n":5,"type":"鈴鐺","zh":"","en":"Bell (South Gate Bridge)","hint":"順著屋頂前進，從屋頂破洞落入建築；出門回到街道，正前方開南門橋鈴鐺。"},{"n":6,"type":"飾品","zh":"","en":"Flameward (Accessory)","hint":"由南門橋鈴鐺走入空地，從右側階梯登上小陽台，開寶箱取得抗火飾品。","chest":true},{"n":7,"type":"影之武裝","zh":"","en":"Fire Meteor (Phantom Edge)","hint":"【主線 Boss】擊敗鬼差隊長火流星（Blaze）取得火隕影之武裝；戰鬥區前方還有關鍵物品紅色血肉花，先撿再離開。","fight":true},{"n":8,"type":"鈴鐺","zh":"","en":"Bell (Jingyang Hall)","hint":"從焰的戰鬥場地往左側祠堂走，入口旁開景陽殿鈴鐺。"},{"n":9,"type":"鈴鐺","zh":"","en":"Bell (Marketplace)","hint":"由景陽殿鈴鐺攀上建築，續走主路登上長階梯，在上方開集市鈴鐺。"},{"n":10,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"集市鈴鐺正前方房屋內收集記憶之花，先不要急著離開這棟樓。"},{"n":11,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"仍在 #10 那棟樓，登頂層，在樓梯旁破洞往下落到陽台，取得黑石碎片。"},{"n":12,"type":"鈴鐺","zh":"","en":"Bell (Huang Manor Crossroads)","hint":"返回集市鈴鐺，上樓梯至盡頭，開黃府岔路鈴鐺。"},{"n":13,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從黃府岔路沿正前方街道走，路邊收集記憶之花。"},{"n":14,"type":"鈴鐺","zh":"","en":"Bell (Pavilion of Knowledge Crossroads)","hint":"黃府岔路右側上樓梯，再往前靠近下一段樓梯，開博識閣岔路鈴鐺。【順路】若陸家村已告知蘭家大少隧道打通，過街接近他可領蘭府鑰匙。"},{"n":15,"type":"飾品","zh":"","en":"Crimson Resolve (Accessory)","hint":"取得蘭府鑰匙後先在任一鈴鐺休息，回到蘭家大少處觸發後續對話，再入宅領取 Crimson Resolve 飾品；若無鑰匙先檢查陸家村相關支線。"},{"n":16,"type":"鑄魂材料","zh":"","en":"Blood Oath Dagger (Tempering Material)","hint":"博識閣岔路右側大樓，沿塔樓清敵攀上屋頂取得頂樓鑰匙；開附近門，若悲泣溪谷四凶斧書冊已蒐齊，與智慧之子交談領取鑄魂材料血誓匕首。"},{"n":17,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"博識閣岔路上樓、穿過巷弄，登上右側建築陽台，走到底開箱取得殺氣琥珀碎片。","chest":true},{"n":18,"type":"武器","zh":"破軍","en":"Armybreaker (Weapon)","hint":"【主線 Boss】擊敗精英影衛騎兵 Cavalrybane，取得 Armybreaker 武器；留意戰場兩側還有收集點。","fight":true},{"n":19,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從 #18 Boss 場地右側樓梯上去，階梯最上方收集記憶之花。"},{"n":20,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"從 #18 Boss 場地左側小庭院進巷弄，走到盡頭箱子拿黑石碎片。","chest":true},{"n":21,"type":"支線","zh":"","en":"The Sword and the Way (Tale)","hint":"從 #18 場地進建築、一路往下到酒館，在水邊找道士畢笛談話，接《道劍佛心》。"},{"n":22,"type":"鈴鐺","zh":"","en":"Bell (Myst’s Tavern)","hint":"幻鬼（Myst）所在地旁右側走廊，啟動幻鬼酒館鈴鐺。"},{"n":23,"type":"支線","zh":"","en":"The Undying Heroic Spirit (Tale)","hint":"酒館大廳找紫衣狼首領接《不滅俠膽》；同時向牛掌櫃交談取得黃府鑰匙，後面要回黃府取四個藥罐零件。"},{"n":24,"type":"支線","zh":"","en":"The Star Performer (Tale)","hint":"同在幻鬼酒館，與領銜戲曲女伶對話，接《頭牌花旦》支線。"},{"n":25,"type":"支線","zh":"","en":"The Cube (Tale)","hint":"酒館找漁夫接《方塊》；【《頭牌花旦》】返回騎兵 Boss 場地右側小巷，對香爐使用女伶提供的胭脂、擊敗出現敵人，取得天香閣鑰匙。"},{"n":26,"type":"寶藏","zh":"","en":"Tiger Paperweight (Treasure)","hint":"用天香閣鑰匙開附近建築，登上二樓後方房間開寶箱，取得妙手小張寶藏「虎型鎮紙」。","chest":true},{"n":27,"type":"鑄魂材料","zh":"","en":"Dancer’s Ribbon (Tempering Material)","hint":"天香閣三樓左側小房間收舞者緞帶鑄魂材料；與舞者互動取得破舊舞扇，稍後帶回女伶。"},{"n":28,"type":"飾品","zh":"","en":"Manor Medicine Pot (Accessory)","hint":"黃府岔路以牛掌櫃給的鑰匙開黃府：呢喃傀儡房取藥罐鍊條，樓梯旁右走廊取把手、樓上櫃子取罐身、臥室樓梯屍體取罐蓋；四件合成黃府藥罐飾品。"},{"n":29,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"黃府取得藥罐的同一房間，收集記憶之花；此點與 #30 分開勾選。"},{"n":30,"type":"支線","zh":"","en":"A Brother Once More (Tale)","hint":"黃府同房間觸發《再會兄長》支線，完成對話／調查後核對任務欄。"},{"n":31,"type":"飾品","zh":"","en":"Dance Fan (Accessory)","hint":"把 #27 破舊舞扇帶回幻鬼酒館交給領銜女伶，領取舞扇飾品。"  Flower","hint":"老根頭的家鈴鐺回頭，用後街地窖手柄開通道，穿地窖上梯，擊敗頂部敵人取得記憶之花。"},{"n":87,"type":"秘藥","zh":"","en":"Merciful Dew (Medicine)","hint":"與 #86 同一敵人的獎勵，取得 Merciful Dew 藥品；來源以兩個編號計算。"},{"n":88,"type":"挑戰","zh":"","en":"Scarecrow (Challenge Location) / Leiting’s Thunder Mask","hint":"老根頭家門前沿坡往下找稻草人，互動與雷霆學徒戰鬥，取得雷霆面具。"},{"n":89,"type":"鈴鐺","zh":"","en":"Bell (Mandate Lodgings)","hint":"從博識閣岔路往上，燒掉左側樹枝，沿路進右側房屋開正道宿舍鈴鐺。"},{"n":90,"type":"鈴鐺","zh":"","en":"Bell (Dockside Warehouse)","hint":"從正道宿舍鈴鐺走屋頂連接路，到正前方碼頭倉庫開鈴鐺。"},{"n":91,"type":"武器","zh":"別離殘鉤","en":"Parting Hooks (Weapon)","hint":"碼頭倉庫鈴鐺往下跳到大庭院，擊敗精英影衛 Soulclaimer，取得 Parting Hooks 武器。","fight":true},{"n":92,"type":"鈴鐺","zh":"","en":"Bell (Pangzhen Docks)","hint":"從 #91 戰場下樓，右側開龐鎮碼頭鈴鐺。"},{"n":93,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"碼頭鈴鐺旁進建築上樓，取得殺氣琥珀碎片。往前碼頭可開梅谷湖船路，但建議先清理正道大營。"},{"n":94,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"回黃府岔路，順路直走後右側上階梯，在上端以炎鬃燒枝條，沿階梯左側取得記憶之花。"},{"n":95,"type":"鈴鐺","zh":"","en":"Bell (Mirage Estate)","hint":"#94 階梯正上方開戲夢山莊入口鈴鐺；目前先只開啟，不要越過劇情分界線。"},{"n":96,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"從戲夢山莊入口鈴鐺轉身落在屋頂，撿黑石碎片。首次龐鎮可取得項目至此。"},{"n":97,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"【正道大營七星劍陣後回訪】先在幻鬼酒館找紫衣狼首領取得破碎英雄勇氣，再從龐鎮貧民區鈴鐺下坡，處理會變成敵人的 NPC，拾取記憶之花。"},{"n":98,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"【七星劍陣後回訪】從衰歌池鈴鐺轉身沿池塘右側繞，再往左上坡處理變異 NPC，拾取記憶之花；若先前打倒可能在地面。"},{"n":99,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Headscarf (Accessory)","hint":"【支線回訪】集齊崇拜大俠的小雪（Xue）任務三件關鍵物後，回博識閣岔路右側樓內找頂樓智慧之子，領取殺氣頭巾飾品。"},{"n":100,"type":"鑄魂材料","zh":"","en":"Illusory Pipa (Tempering Material)","hint":"【梅谷湖後回訪】取得三個幻術琵琶零件，回幻鬼酒館找幻鬼修復；這是 Heartrend Pipa 的鑄魂強化，不會新增一把武裝。"},{"n":101,"type":"支線","zh":"","en":"Don’t Forget Me (Tale)","hint":"【解鎖條件回訪】集市鈴鐺轉身左側樓房解除屏障，登頂樓與臥床少女交談，接《勿相忘》。"},{"n":102,"type":"鑄魂材料","zh":"","en":"Thunder Core (Tempering Material)","hint":"接《勿相忘》的同棟屋，從旁邊房間地板破洞落下，開寶箱取得雷核鑄魂材料。","chest":true},{"n":103,"type":"飾品","zh":"","en":"Auspicious Lion Fireball (Accessory)","hin Memory Flower","hint":"從食屍小雪戰場右側上坡，在左邊小平台拾取記憶之花。"},{"n":13,"type":"鑄魂材料","zh":"","en":"Plain Sword Tassel (Tempering Material)","hint":"#12 往前穿過山脊到開闊處，墓碑旁拾取樸素劍穗鑄魂材料。"},{"n":14,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"#13 墓碑背後小木平台收記憶之花；【小雪任務】往右側洞穴走到底調查第一個任務目標。"},{"n":15,"type":"鈴鐺","zh":"","en":"Bell (Moji’s Cenotaph)","hint":"從小雪洞穴離開，跳到另一側斷橋，沿路前進開墨璣子衣冠塚鈴鐺。"},{"n":16,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"衣冠塚鈴鐺往下跳，緊貼左側牆壁，爬上弓手所在小平台，拾取記憶之花。"},{"n":17,"type":"鈴鐺","zh":"","en":"Bell (Beneath the Watchtower)","hint":"從 #16 往柵欄前進，柵欄右側開瞭望塔下鈴鐺。"},{"n":18,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"從瞭望塔下鈴鐺前往第二座瞭望塔，清敵後獲得黑石碎片。"},{"n":19,"type":"鈴鐺","zh":"","en":"Bell (Battlefield Ruins)","hint":"#18 左側往下跳，貼牆沿路走，開戰場遺跡鈴鐺。"},{"n":20,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"戰場遺跡鈴鐺緊貼左牆沿山谷往前，靠近尖刺牆時左側收記憶之花。"},{"n":21,"type":"影之武裝","zh":"","en":"Bashpole (Phantom Edge)","hint":"【Boss】擊敗巨錘客萬鈞（Wan Jun），取得長柄金瓜／Bashpole 影之武裝。取得後可敲碎特定地板，先回頭補兩處。","fight":true},{"n":22,"type":"鈴鐺","zh":"","en":"Bell (Main Encampment Gate)","hint":"萬鈞戰場開大營正門鈴鐺。"},{"n":23,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"【回頭補收】傳送夕陽小徑，回榕樹處落到旁邊河道，沿河走到終點建築，以長柄金瓜破壞障礙取得殺氣琥珀。"},{"n":24,"type":"秘藥","zh":"","en":"Phantom Remedy (Medicine)","hint":"【回頭補收】傳送戰場遺跡，在可破地板使用長柄金瓜，往下樓梯取得幻影藥品。"},{"n":25,"type":"鈴鐺","zh":"","en":"Bell (Dovecote)","hint":"由大營正門鈴鐺敲碎地板進營地，翻牆後走左邊山坡，在建築右側開鴿舍鈴鐺。"},{"n":26,"type":"支線","zh":"","en":"Daughter of the Dark Sect (Tale)","hint":"鴿舍鈴鐺旁與女子交談，接《魔教之女》，後續劇情需依對話繼續推進。"},{"n":27,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"鴿舍鈴鐺旁建築物後面走到盡頭，拾取記憶之花。"},{"n":28,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"進鴿舍建築上梯，出戶外爬到下一個平台，蹲行穿過左側洞口，取得殺氣琥珀。【重大警告】上方遇紅衣神秘女劍客不可打死，直接盪過鎖鏈離開。","miss":true},{"n":29,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"【紅衣女劍客保留存活】從她所在高處盪鎖鏈，再用長柄金瓜破下方地板，一路落到底到鴿舍捷徑，走木梯到底取得記憶之花。"},{"n":30,"type":"鈴鐺","zh":"","en":"Bell (Three Towers)","hint":"由 #29 返回腳手架頂端，沿路走到塔邊落下，正前方開三高塔鈴鐺。"},{"n":31,"type":"影之武裝","zh":"","en":"Swordsman’s Summon (Phantom Edge)","hint":"【Boss 七星劍陣大師兄】擊敗 Chief Disciple 取得劍客召喚影之武裝。若先前沒打死紅衣女劍客，她將在第二階段參戰，才能拿到額外掉落。","fight":true},{"n":32,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"七星劍陣與紅衣女劍客同場戰鬥後，場地取得第一朵記憶之花。","miss":true},{"n":33,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"【易錯過】同一場地第二朵記憶之花；若先前提前打死紅衣女劍客，可能無法取得。","miss":true},{"n":34,"type":"飾品","zh":"","en":"Twin Fish Pendant (Accessory)","hint":"【易錯過】同一場地的同心雙魚佩飾品；前置同 #33，請在 #28 不要擊殺女劍客。","miss":true},{"n":35,"type":"鈴鐺","zh":"","en":"Bell (Tower Rear Exit)","hint":"#31 Boss 場地旁開高塔後出口鈴鐺；沿河走到盡頭可取得墨璣子宅鑰匙及小雪任務物件，先別繼續推新區。"},{"n":36,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"【回訪龐鎮後】先找幻鬼酒館紫衣狼首領取得破碎英雄勇氣。再從亂葬崗鈴鐺跳下河邊，擊敗會異變的 NPC 並取得記憶之花；必要時保留存檔防掉落異常。"},{"n":37,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從三高塔鈴鐺左側跳下、翻欄杆、上右側斜坡，處理會變異的 NPC 取得記憶之花；若先前打過先檢查地面。"},{"n":38,"type":"鈴鐺","zh":"","en":"Bell (Road to the Training Grounds) / Xue Objective 3","hint":"#37 往左走鉤上懸崖，再爬梯沿路，開通往校場鈴鐺，旁有小雪第三任務物件。【重大警告】先不要殺校場 Boss，會導致白山秘聞失敗。"},{"n":39,"type":"飾品","zh":"","en":"Nameless Thumb Ring (Accessory)","hint":"從通往校場鈴鐺往下，沿右路進左側建築，先拿神像軀幹碎片；上樓寶箱取得無名拇指環。","chest":true},{"n":40,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"從 #39 建築跨橋上坡，從左懸崖攀到剛才屋頂，清掉敵人取得黑石碎片。"},{"n":41,"type":"鈴鐺","zh":"","en":"Bell (Path of the Baishan’s Fall)","hint":"回 #40 山坡走階梯過門，沿主路開白山隕落之路鈴鐺。"},{"n":42,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Fragment","hint":"白山隕落之路鈴鐺正前方清掉從樹裡冒出的敵人，取得殺氣碎片。"},{"n":43,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"#42 繼續前行，跑牆之後找到友方 NPC；其異變後擊敗取得記憶之花。【Bug】敵人掉落可能異常，事先獨立存檔。"},{"n":44,"type":"鈴鐺","zh":"","en":"Bell (The Confinement)","hint":"沿 #43 懸崖山脊一路往前，到平台盡頭開幽禁之地鈴鐺。"},{"n":45,"type":"武器","zh":"靈蛇軟劍","en":"Soft Snake Sword (Weapon)","hint":"【Boss】擊敗軟劍烏冷霜（Wu Lengshuang），取得靈蛇軟劍武器。","fight":true},{"n":46,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"與 #45 相同 Boss 的掉落，取得黑石碎片；兩個來源編號分開核對。"},{"n":47,"type":"飾品","zh":"","en":"Guardian Idol (Accessory)","hint":"#45 Boss 戰場樹旁拿神像腿部碎片；如已拿頭、臂、身，四片合成力士神像飾品。【白山秘聞】接著上樓，在花田調查屍體，這一步必須在校場 Boss 前完成。","fight":true},{"n":48,"type":"鈴鐺","zh":"","en":"Bell (Behind the Encampment Waterfall)","hint":"從白山秘聞屍體往前走，到懸崖下方鈴鐺，開大營瀑布後方鈴鐺。"},{"n":49,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"【高風險掉落 Bug】瀑布後方鈴鐺往前越過左側房子，找到前方大屋，繞到屋後，處理會異變的友方 NPC 取記憶之花；先備份存檔、確認取得才離開。"},{"n":50,"type":"鑄魂材料","zh":"","en":"Hero’s Courage (Tempering Material) – BUGGY","hint":"收齊四個異變 NPC 記憶之花後，可獲英雄勇氣鑄魂材料；若 #49 沒掉，先讀檔不要硬推。","miss":true},{"n":51,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"#49 大屋後方繼續走到碼頭盡頭，開箱取得殺氣琥珀碎片。","chest":true},{"n":52,"type":"鈴鐺","zh":"","en":"Bell (Training Grounds)","hint":"【白山任務完成後】回通往校場鈴鐺，下落並打開左側門，正前方開校場鈴鐺。打 Boss 前務必確認 #47 花田屍體已調查。"},{"n":53,"type":"武器","zh":"白山風雷劍","en":"Baishan Stormswords (Weapon)","hint":"【主線 Boss】擊敗第21號劍客傀儡玉璧（Yubi），取得白山風雷劍武器。","fight":true},{"n":54,"type":"飾品","zh":"","en":"Broken Vessel (Accessory)","hint":"與玉璧同場掉落，取得殘破容器飾品。"},{"n":55,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"玉璧 Boss 場地右側樓梯上，收集記憶之花。"},{"n":56,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"#55 再往上樓梯，在頂端拿第二朵記憶之花；玉璧場地旁建築內另取幻術琵琶背板。"},{"n":57,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從取得琵琶背板的位置續上樓，陽台旁有記憶之花。"},{"n":58,"type":"秘藥","zh":"","en":"Lament Draught (Medicine)","hint":"與 #57 同一陽台旁獲得悲歌藥酒藥品，兩個編號分別勾選。"},{"n":59,"type":"鈴鐺","zh":"","en":"Bell (Training Grounds Depths)","hint":"下樓沿長廊走到盡頭，開校場深處鈴鐺；旁邊幻境傳送門先進入一次觸發《夢差幻境》，目前尚不能完成，之後回訪。"},{"n":60,"type":"鑄魂材料","zh":"","en":"Enhanced Chainsaw (Tempering Material)","hint":"【後期回訪】取得飛天血滴子（Flying Guillotine）後，傳送大營瀑布後方鈴鐺，下坡進左側第一間屋，開右側隱藏房間，取得強化電鋸鑄魂材料。"}]},"梅谷湖":{"key":"v2:梅谷湖","points":[{"n":1,"type":"飾品","zh":"","en":"Battleforged (Accessory)","hint":"從龐鎮碼頭鈴鐺沿左側棧橋進入湖區；左側屋內攀梯，上去後再次左轉，開寶箱拿戰鑄飾品。","chest":true},{"n":2,"type":"鈴鐺","zh":"","en":"Bell (Pangzhen Sha-Chi Tower Upper Level 1)","hint":"續沿山崖上坡，木橋旁啟動龐鎮殺氣塔上層鈴鐺。"},{"n":3,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"由上層鈴鐺入塔上樓，清掉僧兵，取得殺氣琥珀碎片。"},{"n":4,"type":"鈴鐺","zh":"","en":"Bell (Pangzhen Sha-Chi Tower Summ n":"Golden Ammunition (Tempering Material)","hint":"【虎炮回訪】從呂村淺灘鈴鐺出發，用虎炮打破右側牆，取得黃金彈藥鑄魂材料。"}]},"枷籠山":{"key":"v2:枷籠山","points":[{"n":1,"type":"鈴鐺","zh":"","en":"Bell (The Lady’s Path)","hint":"由梅谷湖哭泣霧門進入枷籠山；甦醒後沿左側上坡，開啟夫人之路鈴鐺。"},{"n":2,"type":"飾品","zh":"","en":"Baishan Writ (Accessory)","hint":"自夫人之路鈴鐺沿路走過受傷 NPC，聽到她呼喊後回頭，於屍體拾取白山令飾品。"},{"n":3,"type":"鑄魂材料","zh":"","en":"Iron Butcher Mask (Tempering Material)","hint":"從 #2 進入大型空地，擊敗鐵殺狂暴巨漢，取得鐵殺面具材料。","fight":true},{"n":4,"type":"鈴鐺","zh":"","en":"Bell (Iron Butcher’s Camp)","hint":"鐵殺戰鬥場地內開啟營地鈴鐺。"},{"n":5,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"由鐵殺營地鈴鐺往前直接取得黑石碎片。"},{"n":6,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"從營地鈴鐺回頭攀崖，沿牆滑入建築中層，取得記憶之花。"},{"n":7,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"營地鈴鐺左側上梯子後跑牆，取得記憶之花；繼續上階梯，記得救出腳手架吊籠中的男子，推進崔的支線。"},{"n":8,"type":"飾品","zh":"","en":"Talisman of Despair (Accessory)","hint":"從救人位置燒掉枝葉往下坡，解救另一名吊籠男子，獲得絕望護符飾品。"},{"n":9,"type":"鈴鐺","zh":"","en":"Bell (Hanging Cage Cavern)","hint":"沿 #8 後方山崖路繼續走，洞穴入口開吊籠洞窟鈴鐺。"},{"n":10,"type":"黑石碎片","zh":"","en":"Blackstone Fragment","hint":"進吊籠洞窟大型空地，清掉所有敵人取得黑石。"},{"n":11,"type":"支線","zh":"","en":"The Broad Saber (Tale)","hint":"在 #10 附近打開牢房，與武林人士交談，接「橫刀」相關支線。"},{"n":12,"type":"支線","zh":"","en":"Hero’s Lament (Tale)","hint":"從牢房處上坡，操作鐵鏈放下吊籠並與劉義對話，接「英雄悲歌」。"},{"n":13,"type":"鈴鐺","zh":"","en":"Bell (Cavern Passage)","hint":"劉義吊籠後方即洞窟通道鈴鐺，開啟後可做支線回報。"},{"n":14,"type":"武器","zh":"蕩寇凶刃","en":"Juggernaut (Weapon)","hint":"前進擊敗巨刀統領畢峰，取得巨刃武器；戰後回牢房武林人士處推進《橫刀》支線。","fight":true},{"n":15,"type":"鈴鐺","zh":"","en":"Bell (Commander’s Platform)","hint":"畢峰戰場啟動統領平台鈴鐺。"},{"n":16,"type":"記憶之花","zh":"","en":"Memory Flower","hint":"畢峰場地右側爬腳手架取得記憶之花。【重要】另外到左側樓梯岩石上先拿無根露，再完成崔的第三次救人事件。"},{"n":17,"type":"殺氣琥珀","zh":"","en":"Sha-Chi Amber Fragment","hint":"救出盧三千並推進「勿相忘」相關線索後，沿路回轉至小營地，爬塔取得殺氣琥珀。"},{"n":18,"type":"支線","zh":"","en":"Ledger of Atonement (Tale)","hint":"由 #17 上階梯，反覆與痛苦鐵面人交談，接「贖罪名單」，需後續尋找帳簿。"},{"n":19,"type":"記憶之花","zh":"","en":"Memory Flower" ,060","tips":["她是人偶：殘鋼刃的流血無效，改用黑傷系武器。","兩段揮擊兩下都要招架；長距離斬擊後退躲不掉，要提早招架；低掃改閃。","白百合追蹤可招架，追到或消失後她會瞬移攻擊；紅百合會收縮合體爆炸，遠離。","頭上出現花苞＝即將抓取；紅光抓取等約 1 秒再閃。","11/4 更新後 Wayfarer／Pathbreaker 難度抓取頻率降低。"],"reward":"紅妝鬼斬（早期破盾武器）","src":["https://allthings.how/phantom-blade-zero-hua-deadly-betrothed-boss-fight/"]},{"id":"hunt","name":"「組織」獵殺者：追命","en":"The Hunt, Hunter of the Order","at":"悲泣溪谷:41","main":true,"hp":"18,720 → 六絕凶鐮 20,645","tips":["二階段（六絕凶鐮）死亡會從二階段重來。","長鎖鏈鞭打約 15 m：橫向側閃，不要直線後退。","鉤爪抓取：鎖鏈接近時才閃，不是一丟出就閃。","他懸在鎖鏈上時精準招架藍光，會瞬移到他身邊連擊。","紫色鎖鏈垂直落下：橫向跑；落地前點一下格擋可製造大破綻；龍捲風等結束再上。"],"reward":"追命鎖鐮（解鎖鉤索）、20,000 意識塵埃","src":["https://allthings.how/phantom-blade-zero-the-hunt-boss-fight/"]},{"id":"scavenger","name":"活人偶清道夫＋滅法之法：寒歲","en":"The Puppet Scavenger + Acolyte Hansui","at":"悲泣溪谷:60","main":false,"tips":["緋紅山莊（紅房子）地下，需傀儡之舌才能進入，屬後期回訪。"],"reward":"合金鐮刃鑄魂材料、陽屬傀儡眼、寒歲面具","note":"打法資料待補"},{"id":"threeface","name":"三張臉的詭異魔偶","en":"Aberrant Three-Faced Puppet","at":"悲泣溪谷:3","main":false,"tips":["溪谷夫人裂隙雕像接「三面混沌」挑戰；難度高，建議中後期再打。","完成後才會在血色森林遇到混沌魔偶玉琮。"],"note":"打法資料待補"},{"id":"goldmask","name":"金面具黑衣人","en":"The Gold-Masked One","at":null,"ch":"悲泣溪谷","main":false,"tips":["溪谷、血色森林、梅谷湖三處遭遇戰。"],"note":"打法資料待補"},{"id":"qianxiao","name":"劍癡：花千笑","en":"Hua Qianxiao, the Sword Fanatic","at":"血色森林:7","main":true,"tips":["中距離用飛劍攻擊。","他喝酒時殺氣轉為護盾，喝完會震開身邊所有人：喝酒時退到橋的另一端。","殺氣下降時再貼近，打破後連擊。","側身轉一圈再斬＝紅光，完美閃避；地板旋轉招往外閃；快速連段打完再反擊。"],"reward":"癡者殘劍（醉酒時強化的飛劍）","src":["https://www.18183.com/gonglue/202610/9072916.html"]},{"id":"jingye","name":"亡命徒：荊野","en":"Jing Ye, The Outlaw","at":"血色森林:21","main":true,"hp":"44,083","tips":["⚠ 開打前先回悲泣溪谷交完「見習醫師」，擊敗他後任務失敗。","騎馬階段：衝鋒側閃（後退會被追打），紅光衝鋒閃避；約掉 40% 血下馬（18183 寫 1/2～2/3）。","血滴彈幕會累積流血：連點招架擋掉。","下馬後持荊棘盾：煙霧後的黑光突刺招架會清空殺氣，一定要閃；打到盾會反傷。","裝備：巨凶斧蓄力破盾、斬騎符、破盾符；癡者殘劍喝醉後可遠程打騎馬階段。"],"reward":"亡命斬馬刀（吸血，中前期首選）","src":["https://allthings.how/phantom-blade-zero-jing-ye-boss-fight/","https://www.18183.com/gonglue/202610/9073424_2.html"]},{"id":"ironfever","name":"拳癡：鐵狂","en":"Stone Hand Iron Fever","at":"血色森林:45","main":true,"hp":"33,062","tips":["約 2/3 血時殺氣迸發，攻勢變猛。","紅光抓取：閃避後馬上再閃一次躲後續突進。","紅光跳砸：落地瞬間閃，之後反擊。","藍光拳連段招架；四段連擊格擋約 2 秒後反擊，留意連段結尾的紅光。","距離 4 m 以上再補血；破防後用亡命斬馬刀吸血補回。"],"reward":"鐵拳套影之武裝（消耗純殺氣的三段蓄力，之後削殺氣條的主力）","src":["https://allthings.how/phantom-blade-zero-iron-fever-boss-fight/"]},{"id":"baichilian","name":"雙蛇夫人：白赤練","en":"Bai Chilian, Lady of the Twin Serpents","at":"血色森林:63","main":true,"hp":"29,389 → 獻祭之蛇 33,062","tips":["⚠ 截止點：清理門戶、腐敗祕聞、盜亦有道、救死扶傷、四凶斧前哨部分都要先完成；白山秘聞要先接。","收齊 6 朵虛空記憶之花，二階段弦音會來助戰。","一階：月牙橫掃、緞帶雙斬招架，突進一出手就要招架（判定早）；紅光與強力突進閃避；蛇是直線，往同一側閃。","二階：旋轉三段突刺破防很快，起身時閃；浮空飛出畫面立刻閃，第二下是紅光。","召喚雜兵時殺掉兩隻她會立刻硬直；葫蘆留到二階段。"],"reward":"白蟒赤練、共鳴護符、殘破幻術琵琶","src":["https://allthings.how/phantom-blade-zero-bai-chilian-boss-fight/"]},{"id":"yucong","name":"卅四號·混沌魔偶「玉琮」","en":"Yucong, No. 34 Twisted Puppet","at":"血色森林:88","main":false,"hp":"185,100＋鋼刃／寒冰／混沌三形態 各 111,060","tips":["⚠ 要拿刺骨混沌：最後一擊必須用已鑄魂成「熾焰之刃」的血色長兵器。","若沒出現，先完成悲泣溪谷「三面混沌」。","屬冰雪化後的高難度回訪 Boss。"],"reward":"刺骨混沌、混沌雙匕鑄魂材料","note":"招式打法資料待補","src":["https://allthings.how/phantom-blade-zero-freezing-chaos/"]},{"id":"zhuobi","name":"守門人：拙壁","en":"Zhuo Bi, The Gatekeeper","at":"陸家村:10","main":true,"hp":"41,800＋盾條","tips":["盾條打空會破防約 10–15 秒，之後回滿：用鐵拳套蓄力三段削盾→處決→循環。","盾擊、揮盾、長柄橫掃、藍光、四段連擊都招架；跳砸橫向閃；地刺橫向離開。","紅光（約 225 傷害、穿防）一定閃。","常見失誤：打舉起的盾、格擋紅光、以為閃避能削盾。"],"reward":"堡壘盾影之武裝（可擋箭陣，回血色森林用）、15,000 意識塵埃；場邊寶箱有黑石","src":["https://allthings.how/phantom-blade-zero-zhuo-bi-boss-fight/"]},{"id":"biyuan","name":"天玄派：畢遠掌門殘軀","en":"Master Bi Yuan","at":"陸家村:33","main":true,"hp":"41,800","tips":["動作慢、攻擊性低，適合練招架。","近身劍連段、月牙橫掃招架；側步突刺（801 傷害）在他轉向你時閃。","前衝斬：弱的招架、強的閃；青色劍弧閃穿或貼近；飛斬橫向閃。","他舉防時用鐵拳套蓄力擊退，再用亡命斬馬刀吸血。"],"reward":"天玄青銅劍（降低格擋殺氣消耗）","src":["https://allthings.how/phantom-blade-zero-master-bi-yuan-boss-fight/"]},{"id":"bihai","name":"苦葉寺：碧海大師殘軀","en":"Master Bi Hai","at":"陸家村:42","main":true,"tips":["機制戰：金鐘罩期間無敵，依序擊殺銅僧→鐵僧（環刃）→金僧來削罩；第一波時他不出手。","天玄青銅劍「格擋」破罩最快；巨凶斧蓄力或鐵拳套也可；別用血刃雙子。","破罩後近身戰：出罩時的爆炸要閃，身上金光＝連打，舉防。"],"reward":"苦葉寺珠串影之武裝（召喚僧人助戰 <script>(function(){
'use strict';
const G=window.GUIDE, KEY='pbz_book_checks';
const SLUG={'悲泣溪谷':'weeping-creek-valley','血色森林':'crimson-forest','陸家村':'village-of-lu','龐鎮':'pangzhen','正道大營':'mandate-encampment','梅谷湖':'meigu-lake','枷籠山':'mountain-of-imprisonment','戲夢山莊':'mirage-estate-pangzhen','斷魂山':'mount-soulrend'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const filt={todo:false,miss:false};
try{Object.assign(filt,JSON.parse(localStorage.getItem('pbz_v12_filters')||'{}'))}catch(e){}

// ---- 索引 ----
const P={}; // 'region:n' -> point
for(const [r,v] of Object.entries(G.points)) for(const p of v.points){p.r=r;p.k=v.key+':'+p.n;P[r+':'+p.n]=p}
const bossAt={}, bossNoAt={};
G.bosses.forEach(b=>{if(b.at)(bossAt[b.at]=bossAt[b.at]||[]).push(b);else(bossNoAt[b.ch]=bossNoAt[b.ch]||[]).push(b)});
const qStart={};G.quests.forEach(q=>{if(q.start)(qStart[q.start]=qStart[q.start]||[]).push(q)});
const ptCh={}, bossCh={};
G.chapters.forEach(ch=>{ch.keys=[];const walk=bl=>bl.forEach(b=>{if(b.t==='pts')for(let n=b.a;n<=b.b;n++){const id=b.r+':'+n;ptCh[id]=ch.id;ch.keys.push(P[id].k);(bossAt[id]||[]).forEach(x=>bossCh[x.id]=ch.id)}else if(b.t==='step')ch.keys.push(b.k)});walk(ch.intro);ch.segs.forEach(s=>walk(s.blocks))});

const prog=keys=>{const d=keys.filter(k=>S[k]).length;return[d,keys.length]};
const bar=(d,n)=>`<div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><div class="barlbl">${d} / ${n}</div>`;

// ---- 元件 ----
function bossCard(b){
  const tips=(b.tips||[]).map(t=>`<li>${esc(t)}</li>`).join('');
  return `<details class="boss" id="boss-${b.id}"><summary><span style="font-size:22px">⚔</span><span><div class="bt">${b.main?'主線 BOSS':'可選 BOSS'}${b.hp?' · HP '+esc(b.hp):''}</div><div class="bn">${esc(b.name)}</div><div class="be">${esc(b.en)}</div></span></summary><div class="bd">${tips?`<ul>${tips}</ul>`:''}${b.note?`<div class="todo">${esc(b.note)}</div>`:''}${b.reward?`<div class="meta">🎁 ${esc(b.reward)}</div>`:''}${(b.src||[]).length?`<div class="src">來源：${b.src.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(' ')}</div>`:''}<label class="meta" style="display:block;margin-top:8px"><input type="checkbox" data-k="v12:boss:${b.id}" ${S['v12:boss:'+b.id]?'checked':''}> 已擊敗</label></div></details>`;
}
function point(p){
  const id=p.r+':'+p.n, ok=!!S[p.k];
  const qs=(qStart[id]||[]).map(q=>`<span class="badge b-q" data-q="${q.id}">📜 ${esc(q.name)}</span>`).join('');
  const name=p.zh||'';
  return `${(bossAt[id]||[]).map(bossCard).join('')}<div class="pt${p.miss?' miss':''}${ok?' ok':''}" id="p-${esc(p.r)}-${p.n}" data-miss="${p.miss?1:0}"><input type="checkbox" data-k="${esc(p.k)}" ${ok?'checked':''} aria-label="${esc(p.r)} #${p.n}"><div><div class="top"><span class="num">${esc(p.r)} #${p.n}</span><span class="ty t-${esc(p.type)}">${esc(p.type)}</span>${p.chest?'<span class="badge b-chest">寶箱</span>':''}${p.miss?'<span class="badge b-miss">⚠ 易錯過</span>':''}${qs}${name?`<span class="nm">${esc(name)}</span>`:''}</div><div class="hint">${esc(p.hint)}</div>${p.en?`<div class="en">${esc(p.en)} · <a href="https://www.powerpyx.com/phantom-blade-zero-${SLUG[p.r]}-collectible-locations/" target="_blank" rel="noopener">PowerPyx 圖文 ↗</a></div>`:''}</div></div>`;
}
function block(b){
  switch(b.t){
    case 'p':return `<p class="p">${esc(b.s)}</p>`;
    case 'warn':return `<div class="warn">⚠ ${esc(b.s)}</div>`;

    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(nw)});
    });
    const chk=document.getElementById('pwaCheck');
    chk.onclick=async()=>{chk.textContent='檢查中…';try{await reg.update()}catch(e){}
      setTimeout(()=>{chk.textContent=(reg.waiting||reg.installing)?'有新版本':'已是最新';setTimeout(()=>chk.textContent='檢查更新',2500)},1200)};
    // 從背景回到 App 時自動檢查
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  });
})();
</script></body></html>
