<style>:root{--bg:#101318;--panel:#1a2028;--panel2:#202832;--fg:#f0ece5;--muted:#a7b0bb;--gold:#d7ac72;--line:#323d48;--red:#ef9a9a;--green:#92d3af;--blue:#8fb8e8;--boss:#c47a6a}

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--fg);line-height:1.65}

table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:#5a4430;border:1px solid #a37b4f;color:#f5dcb9;border-radius:28px;padding:11px 16px;font-size:14px;cursor:pointer;box-shadow:0 6px 20px #0009;display:flex;gap:6px;align-items:center}

@media(max-width:950px){.app{display:block}.sidebar{height:auto;overflow:visible}.wrap{padding:14px 16px 80px}h1{font-size:24px}nav .grp{display:none}.toolbar{position:static;border:0;padding:0}.chip{padding:5px 10px;font-size:12px}}

<script>window.GUIDE={"chapters":[{"id":"ch00","title":"序章：物是人非","en":"Prologue","short":"序章","intro":[{"t":"p","s":"基礎教學章。沒有收集品，主要是熟悉操作；開局背包已有三本書（組織、沉思雜記、殺氣改造之謎）。"}],"segs":[{"title":"竹林、庭院與追殺","blocks":[{"t":"step","s":"移動、攀爬與一般攻擊教學","k":"v12:s:ch00:81f942"},{"t":"step","s":"殺氣條：攻擊與招架會消耗殺氣，空了就容易被破防","k":"v12:s:ch00:91336f"},{"t":"step","s":"藍光攻擊＝招架；紅光攻擊＝閃避（全遊戲通用）","k":"v12:s:ch00:0375af"},{"t":"step","s":"少年左殤教學戰（劇情戰）","k":"v12:s:ch00:6ca617"},{"t":"tip","s":"這裡練熟「藍招架、紅閃避」，後面所有 Boss 都靠這個判斷。"},{"t":"step","s":"序章逃亡，抵達悲泣溪谷","k":"v12:s:ch00:e177d2"}]}],"navTitle":"00 序章"},{"id":"ch01","title":"第一章：悲泣溪谷","en":"Weeping Creek Valley","short":"悲泣溪谷","intro":[{"t":"p","s":"主線：逆流而上、鋼鐵巨塔。這章會一口氣接 6 個支線，其中 4 個的截止點在下一章（血色森林）的荊野與白赤練，務必照順序做。"},{"t":"warn","s":"本章接的「見習醫師」在血色森林擊敗荊野時失敗；「清理門戶」「腐敗祕聞」在白赤練前要完成。"}],"segs":[{"title":"開端之地 → 聖母像裂縫 → 殘偶谷底","blocks":[{"t":"pts","r":"悲泣溪谷","a":1,"b":12},{"t":"tip","s":"練邪在溪谷驛站提供武器升級，有空先去認識。"}]},{"title":"殘鋼、驛站與斧老大彭猛","blocks":[{"t":"p","s":"驛站是本章的支線中樞：老弓手、鍛爐守衛、玉兒都在這裡，之後會多次回來交任務。"},{"t":"pts","r":"悲泣溪谷","a":13,"b":24}]},{"title":"斧老大關押處 → 溪谷平原 → 惡弓手營地","blocks":[{"t":"pts","r":"悲泣溪谷","a":25,"b":33},{"t":"warn","s":"#27 護石、#33 羽弓都是限時：拿到斷弦弓就立刻回驛站找老弓手修。"}]},{"title":"溪谷殺氣塔、新娘阿花與塔頂","blocks":[{"t":"pts","r":"悲泣溪谷","a":34,"b":40},{"t":"tip","s":"#38 的殺氣爐手柄用完要拿回來，#52 塔底還要用一次。"}]},{"title":"追命與鎖鐮回頭收","blocks":[{"t":"p","s":"拿到追命鎖鐮後可以鉤索，回頭把溪谷前段的高處補完。"},{"t":"pts","r":"悲泣溪谷","a":41,"b":55},{"t":"step","s":"第一龍柱挑戰（#46）打不過可以先留著，五根龍柱是真結局條件","k":"v12:s:ch01:8d7413"}]},{"title":"離開溪谷前檢查","blocks":[{"t":"step","s":"見習醫師已交（三種藥草→玉兒，領藥箱）","k":"v12:s:ch01:203c7c"},{"t":"step","s":"清理門戶：羽弓已拿","k":"v12:s:ch01:8dbfb8"},{"t":"step","s":"腐敗祕聞：三名敵人已清並回報","k":"v12:s:ch01:6c7b03"},{"t":"step","s":"血肉花已交玉兒","k":"v12:s:ch01:fe6e3d"},{"t":"step","s":"四凶斧已收第一到第五卷","k":"v12:s:ch01:ecc735"},{"t":"tip","s":"紅房子（#54–55）首訪進不去，等枷籠山拿到傀儡之舌再回來。"}]}],"navTitle":"01 悲泣溪谷"},{"id":"ch02","title":"第二章：血色森林","en":"Crimson Forest","short":"血色森林","intro":[{"t":"p","s":"主線：林中血，鏡中蛇。飛賊營地有 4 個限時支線，全部要在章末白赤練前結算。"},{"t":"warn","s":"荊野（#21）前必須已交完溪谷「見習醫師」。"},{"t":"warn","s":"白赤練（#63）前：清理門戶、腐敗祕聞、盜亦有道、救死扶傷都要完成，白山秘聞要先接。"}],"segs":[{"title":"大橋、花千笑、妙手小張與荊野","blocks":[{"t":"pts","r":"血色森林","a":1,"b":22},{"t":"tip","s":"先把妙手小張的籠子放下（#13），之後他會在營地開店並給寶藏任務。"}]},{"title":"飛賊營地：四傷者、密室與三寶","blocks":[{"t":"pts","r":"血色森林","a":23,"b":42},{"t":"tip","s":"飛賊問答答案：地主玉帶 → 蝴蝶 → 信未寫明命運。"}]},{"title":"鏡林、榕樹與白赤練","blocks":[{"t":"pts","r":"血色森林","a":43,"b":64},{"t":"tip","s":"收齊 6 朵虛空記憶之花，白赤練二階段弦音會助戰。"},{"t":"tip","s":"鏡林龍柱（#49）難度高，可先記著。"}]},{"title":"離開森林前檢查","blocks":[{"t":"step","s":"四個限時支線都已交付","k":"v12:s:ch02:a52cb6"},{"t":"step","s":"妙手小張三寶已交","k":"v12:s:ch02:c31264"},{"t":"step","s":"白山秘聞已接、旅舍密室已對話","k":"v12:s:ch02:9a92f0"}]}],"navTitle":"02 血色森林"},{"id":"ch03","title":"第三章：陸家村","en":"Village of Lu","short":"陸家村","intro":[{"t":"p","s":"主線：失心村。敵人多是人偶，流血武器（殘鋼刃、亡命斬馬刀）效果差，改用破防或鈍器系。"},{"t":"tip","s":"珍妖在陸家村入口附近，可升級飾品。"}],"segs":[{"title":"村口、老根頭、蘭家大少與三人偶","blocks":[{"t":"pts","r":"陸家村","a":1,"b":19},{"t":"tip","s":"拙壁戰後拿到堡壘盾，可以穿箭陣——本章結束後回血色森林用。"}]},{"title":"幽藍螢火之廟、大廊橋、黑蛇屋與受傷飛賊","blocks":[{"t":"pts","r":"陸家村","a":20,"b":41},{"t":"warn","s":"#41 受傷飛賊：之後要拿血色森林的飛賊手冊來交，拖太久他可能死亡。"}]},{"title":"苦葉寺、機關巨像與倖存者庭院","blocks":[{"t":"pts","r":"陸家村","a":42,"b":59},{"t":"warn","s":"#53 念珠交莊嚴僧時選「不相信」。"}]},{"title":"傀儡坑、玉瓚、沐小葵與碼頭","blocks":[{"t":"pts","r":"陸家村","a":60,"b":70},{"t":"warn","s":"搭升降梯打沐小葵前，五條緞帶要收齊（大小姐／少主）；戰後碼頭 #69–70 要立刻拿，離開就回不去。"}]},{"title":"走私隧道","blocks":[{"t":"pts","r":"陸家村","a":71,"b":73}]},{"title":"回訪：悲泣溪谷與血色森林（進龐鎮前）","blocks":[{"t":"p","s":"現在有堡壘盾，也開啟了「一個不留」，回去補四處："},{"t":"pts","r":"悲泣溪谷","a":56,"b":57},{"t":"pts","r":"血色森林","a":65,"b":68},{"t":"step","s":"飛賊手冊（森林 #68）交陸家村受傷飛賊","k":"v12:s:ch03:a72f12"},{"t":"step","s":"念珠（溪谷 #56）交莊嚴僧，選「不相信」","k":"v12:s:ch03:fbafcd"}]}],"navTitle":"03 陸家村"},{"id":"ch04","title":"第四章：龐鎮","en":"Pangzhen","short":"龐鎮","intro":[{"t":"p","s":"主線：死鎮、心之蹤跡、四大蛇屋。全遊戲最大的區域（108 點），幻鬼酒館是支線中樞。"},{"t":"tip","s":"幻鬼（幻鬼酒館）可替武器鑄魂：每把一次，5,000 意識塵埃＋材料。"},{"t":"tip" ua, Deadly Betrothed","at":"悲泣溪谷:35","main":true,"hp":"21,060","tips":["她是人偶：殘鋼刃的流血無效，改用黑傷系武器。","兩段揮擊兩下都要招架；長距離斬擊後退躲不掉，要提早招架；低掃改閃。","白百合追蹤可招架，追到或消失後她會瞬移攻擊；紅百合會收縮合體爆炸，遠離。","頭上出現花苞＝即將抓取；紅光抓取等約 1 秒再閃。","11/4 更新後 Wayfarer／Pathbreaker 難度抓取頻率降低。"],"reward":"紅妝鬼斬（早期破盾武器）","src":["https://allthings.how/phantom-blade-zero-hua-deadly-betrothed-boss-fight/"]},{"id":"hunt","name":"「組織」獵殺者：追命","en":"The Hunt, Hunter of the Order","at":"悲泣溪谷:41","main":true,"hp":"18,720 → 六絕凶鐮 20,645","tips":["二階段（六絕凶鐮）死亡會從二階段重來。","長鎖鏈鞭打約 15 m：橫向側閃，不要直線後退。","鉤爪抓取：鎖鏈接近時才閃，不是一丟出就閃。","他懸在鎖鏈上時精準招架藍光，會瞬移到他身邊連擊。","紫色鎖鏈垂直落下：橫向跑；落地前點一下格擋可製造大破綻；龍捲風等結束再上。"],"reward":"追命鎖鐮（解鎖鉤索）、20,000 意識塵埃","src":["https://allthings.how/phantom-blade-zero-the-hunt-boss-fight/"]},{"id":"scavenger","name":"活人偶清道夫＋滅法之法：寒歲","en":"The Puppet Scavenger + Acolyte Hansui","at":"悲泣溪谷:60","main":false,"tips":["前往方式：枷籠山取得「傀儡之舌」後到紅房子門口使用，沿豎井的絲線落點下降，在「清道夫豢養處」鈴鐺休息後再跳入場地。","第一階段只有清道夫：揮擊慢但很重，鐮刀臂的重回身斬可以招架；同一招的快速二連擊版本無法招架。","舉起右臂並閃紅光的抓取無法格擋，看準時機閃避。","約 50% 血量時清道夫被凍住、寒歲登場：冰圈後接冰錐雨、地面冰刺、冰柱分割場地，看到冰圈就立刻離開。","第三階段清道夫另一隻手臂換成巨劍，招式大致沿用第一階段；在牠最慢的揮擊時站到鐮刀臂那一側比較安全。","Game8 推薦白山風雷劍搭配游龍頭上「濕」狀態增傷；飾品可帶白山令、反射裝置。"],"reward":"合金鐮刃（追命鎖鐮鑄魂材料）、寒歲面具（滅法面具之一）、陽屬傀儡眼","note":"寒歲的出場時機與三階段劃分只有 Game8 寫到。","hp":"活人偶清道夫 155,200；寒歲 62,080","src":["https://allthings.how/phantom-blade-zero-puppet-scavenger-boss-fight/","https://game8.co/games/Phantom-Blade-Zero/archives/637189"]},{"id":"threeface","name":"三張臉的詭異魔偶","en":"Aberrant Three-Faced Puppet","at":"悲泣溪谷:3","main":false,"tips":["觸發：悲泣溪谷「聖母像裂縫」鈴鐺旁的雕像互動，進入殺氣裂隙；第一章去幾乎秒死，Fextralife 建議約第四章（龐鎮）再來。","無論勝負都會拿到三頭娃娃並推進「三面混沌」，打輸也不影響任務。","出招速度全遊戲數一數二快：她從裂隙瞬移出來會立刻突進，這段期間不要打長連段。","跳入裂隙後會從正面躍斬再現身：預判時機往前閃過再反擊。","黑光衝刺斬之後常接三連黑光，被破防時也會追加黑光：黑光一律閃避。","兩下慢速逆斬可以格擋或招架；紅光收尾招與大範圍紅色弧斬必須閃避。"],"hp":"88,830","reward":"三頭娃娃（劇情道具，揭示其身分為卅四號玉琮）","src":["https://allthings.how/phantom-blade-zero-aberrant-three-faced-puppet/","https://phantombladezero.wiki.fextralife.com/Aberrant_Three-Faced_Puppet"]},{"id":"goldmask","name":"金面具黑衣人","en":"The Gold-Masked One","at":null,"ch":"悲泣溪谷","main":false,"tips":["遭遇地點（Beebom 列 5 處）：①悲泣溪谷最東側龍柱附近（擊敗追命後取鑰匙，殺氣塔底部營地門後）②血色森林（鐵狂之後岔路往右，用鎖鐮擺盪過去）③梅谷湖最東側島（搭船）④梅谷湖幻術師遺址（從護法四像鏡進入）⑤戲夢山莊；獎勵依擊敗順序發放。","藍白閃光可以招架；紅光（張開大衣躍起下砸、旋轉衝刺）完美閃避，閃過旋轉衝刺可以繞到背後多打幾下。","快速飛刀看清方向持續格擋，閃藍光時招架；抓取後常接致命一擊。","殺氣條打空後全力輸出，約可打 2～3 套完整連段；武器快斷時先切換回殺氣。","method.gg 推薦主武器亡命斬馬刀、副武器黑傷雙刃，帶神機戒；不推薦太慢的巨凶斧。","第 2 場會吸殺氣（切換武器回滿）；第 3 場要持續進攻否則他殺氣回很快；第 4 場可用爆發技打斷大招。"],"note":"各來源對遭遇次數、順序與地點說法不一；HP 不明。","reward":"依擊敗順序：反擊護腕 → 奇蹟劍鞘 → 淬火烈焰之握（碎片）→ 混沌鐵碎片 I","src":["https://allthings.how/phantom-blade-zero-how-to-beat-the-gold-masked-one/","https://www.method.gg/phantom-blade-zero/phantom-blade-zero-how-to-beat-the-gold-masked-one-man-in-black","https://beebom.com/phantom-blade-zero-the-gold-masked-one-locations/"]},{"id":"qianxiao","name":"劍癡：花千笑","en":"Hua Qianxiao, the Sword Fanatic","at":"血色森林:7","main":true,"tips":["中距離用飛劍攻擊。","他喝酒時殺氣轉為護盾，喝完會震開身邊所有人：喝酒時退到橋的另一端。","殺氣下降時再貼近，打破後連擊。","側身轉一圈再斬＝紅光，完美閃避；地板旋轉招往外閃；快速連段打完再反擊。"],"reward":"癡者殘劍（醉酒時強化的飛劍）","src":["https://www.18183.com/gonglue/202610/9072916.html"]},{"id":"jingye","name":"亡命徒：荊野","en":"Jing Ye, The Outlaw","at":"血色森林:21","main":true,"hp":"44,083","tips":["⚠ 開打前先回悲泣溪谷交完「見習醫師」，擊敗他後任務失敗。","騎馬階段：衝鋒側閃（後退會被追打），紅光衝鋒閃避；約掉 40% 血下馬（18183 寫 1/2～2/3）。","血滴彈幕會累積流血：連點招架擋掉。","下馬後持荊棘盾：煙霧後的黑光突刺招架會清空殺氣，一定要閃；打到盾會反傷。","裝備：巨凶斧蓄力破盾、斬騎符、破盾符；癡者殘劍喝醉後可遠程打騎馬階段。"],"reward":"亡命斬馬刀（吸血，中前期首選）","src":["https://allthings.how/phantom-blade-zero-jing-ye-boss-fight/","https://www.18183.com/gonglue/202610/9073424_2.html"]},{"id":"ironfever","name":"拳癡：鐵狂","en":"Stone Hand Iron Fever","at":"血色森林:45","main":true,"hp":"33,062","tips":["約 2/3 血時殺氣迸發，攻勢變猛。","紅光抓取：閃避後馬上再閃一次躲後續突進。","紅光跳砸：落地瞬間閃，之後反擊。","藍光拳連段招架；四段連擊格擋約 2 秒後反擊，留意連段結尾的紅光。","距離 4 m 以上再補血；破防後用亡命斬馬刀吸血補回。"],"reward":"鐵拳套影之武裝（消耗純殺氣的三段蓄力，之後削殺氣條的主力）","src":["https://allthings.how/phantom-blade-zero-iron-fever-boss-fight/"]},{"id":"baichilian","name":"雙蛇夫人：白赤練","en":"Bai Chilian, Lady of the Twin Serpents","at":"血色森林:63","main":true,"hp":"29,389 → 獻祭之蛇 33,062","tips":["⚠ 截止點：清理門戶、腐敗祕聞、盜亦有道、救死扶傷、四凶斧前哨部分都要先完成；白山秘聞要先接。","收齊 6 朵虛空記憶之花，二階段弦音會來助戰。","一階：月牙橫掃、緞帶雙斬招架，突進一出手就要招架（判定早）；紅光與強力突進閃避；蛇是直線，往同一側閃。","二階：旋轉三段突刺破防很快，起身時閃；浮空飛出畫面立刻閃，第二下是紅光。","召喚雜兵時殺掉兩隻她會立刻硬直；葫蘆留到二階段。"],"reward":"白蟒赤練、共鳴護符、殘破幻術琵琶","src":["https://allthings.how/phantom-blade-zero-bai-chilian-boss-fight/"]},{"id":"yucong","name":"卅四號·混沌魔偶「玉琮」","en":"Yucong, No. 34 Twisted Puppet","at":"血色森林:88","main":false,"hp":"185,100＋鋼刃／寒冰／混沌三形態 各 111,060","tips":["⚠ 觸發：進戲夢山莊、血色森林冰雪化後，從鏡林沿冰道到絲線纏繞的巨樹鈴鐺休息再進場；必須裝備由血色長兵器鑄魂而成的「熾焰之刃」，才會觸發第三階段並拿到完整獎勵。","一、二階段大多數招式可以格擋但會削殺氣；空中頭槌接短刺、快速斜斬、快速旋斬、長蓄力劍砸這四招建議閃避。","一、二階段唯一可招架的是空中連斬後接的藍光；穿越傳送門的攻擊持續格擋，看到蓄力起手再閃。","二階段寒冰面具會累積冰凍，快凍結就拉開距離；混沌面具的火焰削血與殺氣，近距離火焰連打可格擋，黑煙攻擊務必閃避。","三階段分裂成鋼刃、寒冰、混沌三具（玉妖與鐵鬼協助你）：建議擊殺順序 鋼刃→混沌→寒冰，在場內繞跑把三者拉開，別站在中間吃黑光。","推薦熾焰之刃火屬性（三階段多用蓄力重擊），飾品帶神機戒、共鳴護符、避火符／避寒符；鎖鐮可在她傳送後拉近距離。"],"reward":"刺骨混沌（三形態單手劍）、混沌鐵碎片 II（配合碎片 I 把黑傷雙刃升為混沌雙匕）","note":"三階段要集火一隻還是平均分配傷害，各來源說法不一。","src":["https://game8.co/games/Phantom-Blade-Zero/archives/636885","https://phantombladeatlas.com/bosses/yucong/","https://allthings.how/phantom-blade-zero-freezing-chaos/"]},{"id":"zhuobi","name":"守門人：拙壁","en":"Zhuo Bi, The Gatekeeper","at":"陸家村:10","main":true,"hp":"41,800＋盾條","tips":["盾條打空會破防約 10–15 秒，之後回滿：用鐵拳套蓄力三段削盾→處決→循環。","盾擊、揮盾、長柄橫掃、藍光、四段連擊都招架；跳砸橫向閃；地刺橫向離開。","紅光（約 225 傷害、穿防）一定閃。","常見失誤：打舉起的盾、格擋紅光、以為閃避能削盾。"],"reward":"堡壘盾影之武裝（可擋箭陣，回血色森林用）、15,000 意識塵埃；場邊寶箱有黑石","src":["https://allthings.how/phantom-blade-zero-zhuo-bi-boss-fight/"]},{"id":"biyuan","name":"天玄派：畢遠掌門殘軀","en":"Master Bi Yuan","at":"陸家村:33","main":true,"hp":"41,800","tips":["動作慢、攻擊性低，適合練招架。","近身劍連段、月牙橫掃招架；側步突刺（801 傷害）在他轉向你時閃。","前衝斬：弱的招架、強的閃；青色劍弧閃穿或貼近；飛斬橫向閃。","他舉防時用鐵拳套蓄力擊退，再用亡命斬馬刀吸血。"],"reward":"天玄青銅劍（降低格擋殺氣消耗）","src":["https://allthings.how/phantom-blade-zero-master-bi-yuan-boss-fight/"]},{"id":"bihai","name":"苦葉寺：碧海大師殘軀","en":"Master Bi Hai","at":"陸家村:42","main":true,"tips":["機制戰：金鐘罩期間無敵，依序擊殺銅僧→鐵僧（環刃）→金僧來削罩；第一波時他不出手。","天玄青銅劍「格擋」破罩最快；巨凶斧蓄力或鐵拳套也可；別用血刃雙子。","破罩後近身戰：出罩時的爆炸要閃，身上金光＝連打，舉防。"],"reward":"苦葉寺珠串影之武裝（召喚僧人助戰，後期清雜兵很強）","src":["https://allthings.how/phantom-blade-zero-master-bi-hai-boss-fight/"]},{"id":"yanru","name":"滅法之法：炎茹","en":"Acolyte Yanru","at":"陸家村:48","main":false,"tips":["觸發：陸家村機關巨像殘骸附近、掛紅燈籠大樹下的淺池（梯田鈴鐺以東），與張開雙臂的紅袍符咒稻草人互動；先清掉池邊村婦與 3 名小混混。","以遠程火攻為主，基本靠閃避：格擋火球仍會被燒傷，往側面閃並繞到她背後。","近距離火焰噴射不追蹤，貼身從背後打；正面判定比看起來寬。","火球俯衝後留下的火環會紅光爆炸，用幻影反擊貼近；地面爆裂環用完美閃避反制。","她靜止準備起飛時用爆發技可打出硬直，能吃滿整套連段。","帶抗燃燒道具（青蛇藥劑）；進場前在鈴鐺休息補滿回復藥。"],"reward":"炎茹面具（滅法面具之一）","hp":"42,210","src":["https://allthings.how/phantom-blade-zero-acolyte-yanru-boss-fight/","https://phantombladezero.wiki.fextralife.com/Acolyte_Yanru"]},{"id":"dangsui","name":"操偶師：蕩穢","en":"Dusk, The Puppeteer","at":"陸家村:61","main":false,"hp":"62,520","tips":["解鎖：收齊 6 朵螢火記憶之花→清掉寺旁屋內的霧→跳入破碎傀儡坑。","剩 40% 血他會退開，出現紅眼分身（約 20,840）：先殺分身，本體（黑臉）血量會降到約 15,630。","巨型人偶女的掌擊／手臂橫掃左右閃；懸空手紅光閃、藍光招架。","先清人偶群（每隻 880）；苦葉寺珠串召喚很有用。"],"reward":"傀儡師鈴影之武裝、幻術琵琶琴頭","src":["https://allthings.how/phantom-blade-zero-dusk-boss-fight/"]},{"id":"yuzan","name":"三號·樂師偶「玉瓚」","en":"Yuzan, No. 3 Musician Puppet","at":"陸家村:65","main":true,"hp":"52,100","tips":["她會不斷後跳拉開距離。","紅色刀刃齊射：晚一點閃；藍刃接紅刃＝連閃兩次。","白色光球可精準招架反彈，離她越遠反彈越痛。","暗青色吸引球：立刻跑到場地邊緣，後續是抓取或爆炸，補血救不回。","苦葉寺珠串的僧人能有效牽制。"],"reward":"斷腸琵琶影之武裝","src":["https://allthings.how/phantom-blade-zero-yuzan-boss-fight/"]},{"id":"muxiaokui","name":"「組織」少主：沐小葵","en":"Mu Xiaokui, Young Mistress of the Order","at":"陸家村:68","main":true,"hp":"46,890 → 鐵玉女王 62,520 → 玉妖／鐵鬼 各 41,680","tips":["⚠ 上升降梯前完成「大小姐」緞帶（5 條）才有第三階段與額外掉落；戰後碼頭 #69–70 要立刻拿。","跳斬／白色突進：連閃兩次，中間留一拍；紅色旋轉連段看到光環就離開；延遲重擊在揮下時閃。","二階段紫光＝召喚物攻擊，不要反擊，閃開等它結束。","三階段先殺鐵鬼，兩個都保持在畫面前方；追命鎖鐮可同時打到兩隻。","推薦：亡命斬馬刀＋貪狼，提升純殺氣上限；妙手千鈞、筋力綁帶、渾源經脈儀。"],"reward":"四十四號人偶之眼（通往龐鎮）、拳之碎片：核、妖鋸","src":["https://allthings.how/phantom-blade-zero-mu-xiaokui-boss-fight/","https://www.method.gg/phantom-blade-zero/phantom-blade-zero-how-to-beat-mu-xiaokui-and-jade-dancer-iron-fiend"]},{"id":"blaze","name":"鬼差隊長：火流星","en":"Blaze, Shadow Warden Captain","at":"龐鎮:7","main":true,"hp":"48,560 → 磷火意識 60,700","tips":["戰前在鈴鐺旁寶箱拿「避火符」：火焰傷害與燃燒減半。","一階：香爐鞭擊與藍光連段招架；紅光砸地不可招架要閃，在他跳起時閃可造成大量削韌；叫小兵時用珠串或鎖鐮。","二階綠火：地裂變火圈要離開；天上火環延遲砸下，後退或跳過。","⚠ 二階紅光火焰抓取可能一擊秒殺：一律完美閃避，這階段不要招架。","亡命斬馬刀的爆發技留作緊急補血。"],"reward":"火流星影之武裝；場地前方的紅色血肉花記得撿","src":["https://allthings.how/phantom-blade-zero-blaze-boss-fight/"]},{"id":"cavalrybane","name":"鬼差高手：斬騎","en":"Cavalrybane, Elite Shadow Warden","at":"龐鎮:18","main":true,"hp":"62,900＋兩名騎槍兵","tips":["三個敵人都保持在畫面前方，騎兵在背後時不要換血。","紅光低架勢與上方月牙斬：橫向閃（不可招架）；旋轉橫掃後退出範圍；跳擊閃後打收招。","前滾後會兩刺加終結技：閃掉終結技觸發電影反擊，大量削殺氣。","裝備斬騎符（對騎乘敵人 +25%）。"],"reward":"破軍（武器）","src":["https://allthings.how/?p=319041"]},{"id":"wuxuan","name":"墮落將軍：武軒","en":"Wu Xuan, The Fallen General","at":"龐鎮:35","main":true,"hp":"76,300","tips":["約 70% 血召喚瘟氣：地面與鎚子變紫。","紅光連段：前段格擋或招架，最後一擊閃；紅光抓取在突進時閃。","紫色波與紫色突進：橫向閃，不要後退；別站在發光地面。","開場有厚盾，每次招架大幅削盾，歸零後處決狂打；約兩輪結束戰鬥。","不要退到庭院後緣，會掉到下面巷子。"],"reward":"狼顎影之武裝、24,000 意識塵埃","src":["https://allthings.how/phantom-blade-zero-wu-xuan-boss-fight/"]},{"id":"guwanyue","name":"女妖骨婉約","en":"Gu Wanyue, The Wailing Wraith","at":"龐鎮:48","main":true,"hp":"53,410","tips":["她把頭埋進手臂（擋住視線）＝馬上退開。","尖叫不可格擋：閃出範圍；被定身就狂按提示鍵。","消失後飛撲抓取（683 傷害）：保持距離舉防。","黑霧無法彈開、紅光不可招架，都要躲；只在招式間隙輸出。","亡命斬馬刀＋貪狼吸血流打起來很輕鬆。"],"reward":"癡者殘片：執念、24,000 意識塵埃","src":["https://allthings.how/phantom-blade-zero-gu-wanyue-boss-fight/"]},{"id":"xieqiudong","name":"神醫：謝秋冬","en":"Xie Qiudong, The Divine Healer","at":"龐鎮:52","main":true,"tips":["他打中你會回血。","被綁住的雜兵：打它們他會替其治療並自損。","先殺可自由行動的雜兵，清完後他幾乎就倒了。","注意貼地的樹根鞭擊；遠離紅色酒桶（會起火）。"],"reward":"Everflow 秘藥","src":["https://allthings.how/phantom-blade-zero-xie-qiudong-boss-fight/"]},{"id":"youloong","name":"水行幫主：游龍","en":"You Loong, Leader of the Blackwater Crew","at":"龐鎮:63","main":true,"hp":"78,750","tips":["三叉戟橫掃與刺擊招架；突刺距離很長，後退躲不掉。","水泡直線攻擊：橫向閃。","腳下出現漩渦＝他要從身邊冒出，立刻閃。","不要跑上階梯街，會引來劍客群。"],"reward":"游龍頭（打舞獅尊主必備，也能滅火障）","src":["https://allthings.how/phantom-blade-zero-you-loong-boss-fight/"]},{"id":"changhong","name":"「雷槍」：長鴻","en":"Chang Hong, The Thunder Spear","at":"龐鎮:69","main":true,"hp":"78,750 → 騎馬 87,500","tips":["⚠ 對面建築的老人（#70）要先救：需要悲泣溪谷的血肉花。","雷擊召喚：離開腳下圓圈，會累積麻痺；麻痺快滿喝青蛇藥劑。","一階七段連擊與旋轉突進的最後一擊是紅光：閃後反擊；藍光突刺招架；紅光抓取閃。","二階騎馬雨中：繞圈衝鋒橫向閃，騎槍突刺點格擋。","避雷符＋斬騎符；18183 建議二階前死一次換上斬騎符也值得。"],"reward":"雷槍影之武裝","src":["https://allthings.how/phantom-blade-zero-chang-hong-boss-fight/"]},{"id":"flame","name":"被面具控制的舞獅尊主：烈焰","en":"Flame, The Mask-Bound Lion Dance Grandmaster","at":"龐鎮:75","main":true,"hp":"88,830 → 98,700","tips":["建議先打游龍拿游龍頭：用它把他澆濕，火焰招式會失效。","火焰噴射不可格擋：橫向衝刺。藍光起手招架、紅光閃。","梅花樁火球對決：藍光時把火球反彈讓他硬直；紅光他會直劈下來。反覆對拼直到一方殺氣破。","最後處決他的「嚯嚯」動作就能擊倒；黑光攻擊後接突刺。","帶避火符。"],"reward":"沉睡炎鬃（雷當修復後成為炎鬃影之武裝，可燒樹枝）","src":["https://allthings.how/phantom-blade-zero-lion-dance-grandmaster-boss-fight/"]},{"id":"soulclaimer","name":"鬼差高手：勾魂","en":"Soulclaimer, Elite Shadow Warden","at":"龐鎮:91","main":false,"hp":"76,300 / 116,280","tips":["位置：取得炎鬃後，經屋頂與鎖鏈開「正道臨時居所」「碼頭倉庫」兩座鈴鐺，再上樓梯到頂端開打；身旁 2 名白山派弟子先清掉。","雙刀交叉／刀身發光的反擊架勢：此時出手會被打斷勾倒，接著還有紅光下劈，要閃避並在起身時接幻影反擊；看到架勢就轉守。","快速下潛與前滾翻躍斬都是紅光，必須閃避；眼睛閃紅光的追蹤躍斬往側面閃出範圍。","側向旋轉連斬最後以藍光十字斬收尾，可以招架；也可在他旋轉途中用武器技打斷。","中距離蹲低後的飛踢、削殺氣的躍擊會讓你硬直，起手比紅光招慢，有時間反應。","亡命斬馬刀＋貪狼吸血就夠用；貼身打、多招架，減少被旋轉連斬破防。"],"reward":"別離殘鉤；擊敗後解鎖離開龐鎮的船","note":"HP 未證實。","src":["https://phantombladezero.wiki.fextralife.com/Soulclaimer_Elite_Shadow_Warden","https://game8.co/games/Phantom-Blade-Zero/archives/636023","https://www.18183.com/gonglue/202610/9073392.html","https://www.18183.com/gonglue/202610/9073424_6.html"]},{"id":"leiting","name":"滅法之法：雷婷","en":"Acolyte Lei Ting","at":"龐鎮:86","main":false,"tips":["位置：龐鎮「老根頭家」鈴鐺附近的符咒稻草人（後巷坡道，往斷橋方向）；KeenGamer 說要先有炎鬃燒掉擋路的藤蔓。","坡道上有赤衣劍客與無面隊長，建議直接跑過去，從鈴鐺出發直接進場。","分身連段（藍色雷彈、近身斬、三發藍彈）全部完美招架，可以削掉她半條殺氣。","紅色雷環、以紅色光束收尾的蓄力連段：用幻影反擊把雷電彈回或瞬移到她身邊。","浮空後突進的四連擊往右閃或招架後三下；她瞬移後立刻衝過去趁硬直輸出。","地面電場碰到前跳過；雷擊落點圈不要站著；雷電會累積麻痺。"],"note":"稻草人的確切方位各來源說法不一。","hp":"88,830","reward":"雷婷面具（滅法面具之一）","src":["https://allthings.how/phantom-blade-zero-acolyte-lei-ting-boss-fight/","https://phantombladezero.wiki.fextralife.com/Acolyte_Lei_Ting","https://www.keengamer.com/articles/guides/phantom-blade-zero-all-4-acolyte-locations-and-discordance-realm-rewards/"]},{"id":"xiaoxue","name":"吞噬屍體的小雪","en":"Corpse-Eating Xue","at":"正道大營:11","main":false,"tips":["位置在亂葬崗，需用正道谷門鑰匙開門進入。","主要威脅是抓取：被按倒啃食時，照畫面紅光提示掙脫。","優先打小雪本體：她會吃倒下小怪的屍體回血。","她帶一群不死小怪，讓所有敵人留在畫面內，避免被背後偷襲。","method.gg 推薦快速單手武器（殘鋼刃）；影之武裝用巨凶斧或長柄金瓜清場；帶 Everflow 靠殺小怪回血。"],"note":"沒有找到招式或階段資料。","hp":"109,881","reward":"無掉落；開啟「崇拜大俠的小雪」。之後收集黑劍鞘、素髮簪、斷鐵劍交給龐鎮八卦閣的智慧之子，可得殺氣頭巾（殺氣回復 +15%）","src":["https://www.method.gg/phantom-blade-zero/phantom-blade-zero-xue-admirer-of-heroes-guide","https://allthings.how/?p=314404"]},{"id":"wanjun","name":"巨錘客：萬鈞","en":"Wan Jun, The Coppermaul","at":"正道大營:21","main":true,"tips":["在「箭塔之下」鈴鐺往東約 8 m，劈開鐵鍊路障後開戰；場上還有一隊無面兵（含騎兵）。","雙手舉錘過頂＝要下砸，往側面閃出範圍。","衝鋒、飛身撞地、翻滾衝撞距離都很長，直線後退躲不掉，要側閃。","頭部閃紅光後可能接旋轉突進：必須閃避，不能格擋。","他坐下、皮膚變灰龜裂（石膚）時是最長的輸出窗口；重擊收招硬直很長也可反打。"],"reward":"長柄金瓜影之武裝（可擊碎脆弱地板），解鎖「大營正門」鈴鐺","hp":"146,508","src":["https://allthings.how/phantom-blade-zero-wan-jun-boss-fight/","https://www.noobfeed.com/articles/phantom-blade-zero-all-bosses"]},{"id":"red","name":"紅衣女劍客","en":"Red, The Mysterious Swordswoman","at":"正道大營:28","main":false,"tips":["先在鴿舍鈴鐺旁和迷茫的女劍客對話，再進塔、爬梯、走牆，到塔頂屋簷開戰。","刀身閃紅光後會沿屋頂衝刺斬並留下長條紅色軌跡：橫移離開軌跡。","幾公尺外沿屋脊突刺、近身快速連斬：穩住防禦節奏。","抓領摔與衝刺斬是主要傷害；她跳上塔尖後會俯衝，保持移動。","⚠ 要做「魔教之女」就不要殺她：TapTap 說初見可繞過不打，她會在七星劍陣大師兄戰亂入；之後在高塔後方出口鈴鐺附近約 6 m 可拿到她的記憶之花，斷魂山決戰前還會再出現。"],"hp":"70,812","reward":"戰鬥本身無道具；放過她的話，記憶之花給記憶與殺氣類飾品","src":["https://allthings.how/phantom-blade-zero-red-mysterious-swordswoman-boss-fight/","https://www.taptap.cn/moment/722554198821964927"],"note":"「放過她」的確切觸發方式（血量門檻／脫戰）沒有來源說明，建議遇到前手動存檔。"},{"id":"qixing","name":"七星劍陣：大師兄","en":"Chief Disciple of the Seven-Stars Formation","at":"正道大營:31","main":true,"tips":["一階段有白衣七星弟子圍攻：沿劍陣外緣繞圈避免被包圍，或先清弟子再打大師兄。","大幅橫揮之後會甩出橫跨全場的藍色劍氣月牙，提前閃開。","他會從弟子頭上躍過來接近你，留意這招起手。","二階段被紅線吊起、場地變紅：放射狀紅線、盪線下劈、沿紅線俯衝，保持移動。","戰前沒有鈴鐺，死亡後從「通往校場的路」鈴鐺（約 66 m 外）走回來。"],"reward":"劍客召喚影之武裝、校場鑰匙、雙俠記憶花瓣 II，解鎖高塔後方出口鈴鐺","hp":"90,350 → 絕望之劍 125,100","src":["https://allthings.how/phantom-blade-zero-chief-disciple-seven-stars-formation-boss-fight/"]},{"id":"wulengshuang","name":"軟劍：烏冷霜","en":"Wu Lengshuang, The Soft Sword","at":"正道大營:45","main":true,"tips":["⚠ 「白山秘聞」：打完要先上樓調查花田屍體，才能去打校場的玉璧。","她會懲罰貪刀：穩守反擊，不要過度追擊。","快速劍招連段要逐招應對，不要搶招。","可格擋的重招與必須閃避的紅光招混著出，嚴格照藍／紅光區分。","FandomWire 把她列為全遊戲第二難的 Boss，建議先強化武器再來。"],"reward":"靈蛇軟劍、黑石碎片","note":"沒有詳細的招式或階段資料，以上為概略建議。","hp":"125,100","src":["https://www.noobfeed.com/articles/phantom-blade-zero-all-bosses","https://allthings.how/?p=316427"]},{"id":"yubi","name":"廿一號·劍偶「玉璧」","en":"Yubi, No. 21 Swordfighter Puppet","at":"正道大營:53","main":true,"tips":["⚠ 開打前確認白山秘聞的花田調查已完成，否則任務失敗。","刀身出現藍白星光時會連續出招，每一下都可以格擋。","白金閃電突刺、青色長光突刺射程很遠，直線後退躲不掉，要橫向閃。","會分出半透明青色分身與本體同時或隨後出招，注意第二段攻擊。","腳下金色圓圈會延遲爆炸，立刻離開；空中跳起停頓後會下砸。","大半血量後颳起沙塵暴：落雷加大範圍金色月牙，同時注意地面和天空。"],"reward":"白山風雷劍（雙刃）、破器飾品、幻術琵琶零件","hp":"139,000","src":["https://allthings.how/phantom-blade-zero-yubi-boss-fight/","https://www.noobfeed.com/articles/phantom-blade-zero-all-bosses"]},{"id":"zhuyuan","name":"火刀：祝原","en":"Zhu Yuan, The Searing Blade","at":"梅谷湖:5","main":true,"note":"沒有血量與階段資料。","reward":"灼焰鑄魂材料（有另一塊碎片會合成「烈焰之握」，用來把血色長兵器鑄魂成熾焰之刃）","tips":["位置在梅谷湖殺氣塔熔爐廳，從熔爐鈴鐺走約 23 m 即開戰。","火焰橫掃等刀身近戰招式可以格擋。","遠程飛焰月牙、沿地面竄來的火線要橫向側閃，不要迎面衝。","會在你腳下噴火柱，也會跳起下劈。","地面餘燼和火堆會持續燃燒，離開火區再打；帶避火符。"],"src":["https://allthings.how/phantom-blade-zero-zhu-yuan-boss-fight/"]},{"id":"yanqiansui","name":"琴女：煙千歲","en":"Yan Qiansui, The Zither Maiden","at":"梅谷湖:18","main":true,"tips":["先收齊六朵燕兒記憶之花（迷局「浮華引」）她才會出現，在梅谷湖歌坊碼頭附近的廟院。","約 40 m 前先補滿血：她約 12 m 就開打，沒準備好會先被打掉三分之一血。","空中成排的紅藍音符會飛向你：閃開彈幕，趁她停頓輸出。","沿地面放紅色刀光、腳下紅爆、周圍升起紅色火柱，持續移動。","場地沒有霧門可重置，帶足回復藥。"],"reward":"幻術琵琶弦、癡者殘片：執著","hp":"73,254","src":["https://allthings.how/phantom-blade-zero-yan-qiansui-boss-fight/"]},{"id":"jin","name":"悲痛欲絕的阿瑾","en":"Grief-Stricken Jin","at":"梅谷湖:21","main":false,"reward":"繡鞋（紅妝鬼斬鑄魂材料）、胭脂盒；碼頭記憶之花推進「再會兄長」","tips":["一開場就有紅衣兵從四面圍上，他們造成大部分傷害：先清小怪或不停移動避免被包圍。","紅色波浪推過淺灘時，後面跟著小兵衝鋒，持續走位。","刀身閃紅光是快速突擊，必須閃避。","會高跳舉紅刀下劈，注意落點。"],"hp":"79,358","src":["https://allthings.how/phantom-blade-zero-grief-stricken-jin-boss-fight/"]},{"id":"guhe","name":"滅法之法：古河","en":"Acolyte Guhe","at":"梅谷湖:37","main":false,"tips":["搭船登島，從碼頭走約 62 m 和燈籠樹旁的稻草人互動開戰；島上沒有鈴鐺，出發前先休息。","盡量貼身 4 m 內打：近身受到的傷害明顯比中距離少。","綠色毒彈幾乎連發；開場的重毒彈傷害很高。","分身射擊出現紅光要閃避；近距離注意扇子大範圍揮擊。","死亡後在樹旁復活，不是回鈴鐺。"],"reward":"古河毒面具（滅法面具之一，湖心秘密需要）","hp":"本體 109,881＋4 個持扇分身各 97,672","src":["https://allthings.how/phantom-blade-zero-acolyte-guhe-boss-fight/"]},{"id":"youloong2","name":"狂暴水行幫主：游龍","en":"You Loong, The Frenzied","at":"梅谷湖:40","main":true,"tips":["在黑水幫寨內淹水的院子；直走進場，避開甲板上用魚竿拉人的兩個釣客。","三叉戟橫掃（帶青色水波）和低位突刺可以格擋。","藍青色水球側閃，不要站在行進路線上。","他蹲低時你腳下會噴高傷害水柱，立刻離開。","近身旋轉擊會擊倒你，看到起手就拉開；亡命斬馬刀＋貪狼吸血，危急時用武器技回血。"],"reward":"龍三叉戟影之武裝（遠程投擲）、高壓水泵（游龍頭鑄魂材料）；兩戰都打贏有獎盃","hp":"115,200","src":["https://allthings.how/phantom-blade-zero-frenzied-you-loong-boss-fight/"]},{"id":"heartpiercer","name":"鬼差高手：穿心","en":"Heartpiercer, Elite Shadow Warden","at":"梅谷湖:57","main":false,"tips":["用龍紋徽開白蛇屋雕花門，靠近院子中央蹲著的他就開戰。","落地後藍光踢擊連段逐下格擋；投刀後衝刺過來的斬擊也可以格擋。","近身紅光旋轉突進不可格擋要提早閃；9–10 m 外的紅光飛刃連射，等刀接近再閃。","後跳後丟出的成串飛刃改用防禦架住，比硬吃傷害少很多。","控好殺氣：殺氣低時最容易被打崩，擋一下重擊會吃掉大量殺氣。"],"reward":"裂雙斧、14 萬意識塵埃、白蛇之眼","hp":"115,200","src":["https://allthings.how/phantom-blade-zero-heartpiercer-boss-fight/"]},{"id":"oneeye","name":"獨眼弓客","en":"One-Eyed Archer","at":"梅谷湖:61","main":false,"reward":"獨眼弓影之武裝（遠程，探索時可射落懸掛物）","tips":["登獨眼島先開碼頭鈴鐺，沿小溪走進廢村開戰。","隔著溪流遠射時會先拉出一條紅色長線標出箭道：看到紅線立刻橫移。","壓低身子帶紅光逼近後接連斬；紅色月牙橫掃和弓身突刺範圍比看起來大。","近戰連段後會後撤重新拉弓，趁他隔水舉弓時補血或衝上去。","低血量時場景轉紅，他撲過來後地面一點放射出十幾道射線，離開那個點。"],"hp":"128,160","src":["https://allthings.how/phantom-blade-zero-one-eyed-archer-boss-fight/"]},{"id":"blizzard","name":"風雪刀客","en":"Blizzard Blademaster","at":"梅谷湖:96","main":true,"tips":["開戰動畫前先開「白影的墜落」鈴鐺。","被冰凍招打中會被封在冰裡，可能被連死：最優先躲冰凍招。","他喊「看好了，我只出一刀！」時放出地面冰環，遠離或閃開。","看到紅光就閃；蓄力後的第二段追擊通常是紅光，要完美閃避。","高跳重砸、近身地面冰刺；大蓄力招與多段連擊結束後是輸出窗口。帶避寒類抗性飾品。"],"hp":"186,240","reward":"白影（武器）；擊敗後九十九號人偶出現（湖心秘密）","src":["https://allthings.how/phantom-blade-zero-blizzard-blademaster-boss-fight/","https://powerupgaming.co.uk/2026/11/01/phantom-blade-zero-secrets-at-the-heart-of-the-lake-guide/"]},{"id":"elder","name":"九十九號人偶儀式（高階長老）","en":"High Elder ritual (Puppet No. 99)","at":"梅谷湖:97","main":false,"hp":"每個跪地人影約 3,646","tips":["擊敗風雪刀客後，冰湖上出現多臂的九十九號人偶（白影的墜落鈴鐺約 40 m 外）；嵌入陰、陽兩顆水晶人偶眼就進入儀式。","場地是淺水，周圍有紅光幕，散布多個跪地人影，各有自己的血條。","人影幾乎不反擊也不追你：依序走到最近的一個打到歸零即可。","全部擊殺後播放巨型紅花動畫，醒來在幻境的虛空身旁；與虛空對話。"],"reward":"紫花（虛空光扇鑄魂材料）；推進湖心秘密","src":["https://allthings.how/?p=321475","https://powerupgaming.co.uk/2026/11/01/phantom-blade-zero-secrets-at-the-heart-of-the-lake-guide/"],"note":"不是一般 Boss 戰；「高階長老」中文名未查到。"},{"id":"tiesha","name":"鐵殺","en":"Iron Butcher, The Frenzied Brute","at":"枷籠山:3","main":true,"reward":"鐵殺面具（殘鋼刃鑄魂材料）；戰後開鐵殺營地鈴鐺","tips":["開打前先清掉鷹架上的火弓手，並在祭拜聖母之路鈴鐺休息。","藍光三連（兩刀後第三下藍光）要招架，常接在投罐之後。","遠距離時會連揮四刀再突進兩次：第二次突進是紅光抓取，傷害很高，一定閃避。","轉身、手上冒煙＝紫色混沌火罐（可能連丟三罐），準備側閃；踩到紫火會持續燃燒，馬上離開。","丟紫罐後常接大範圍炸彈，兩顆飛得慢但很痛，要閃開。"],"hp":"104,652","src":["https://allthings.how/phantom-blade-zero-iron-butcher-boss-fight/","https://phantombladezero.wiki.fextralife.com/Iron_Butcher_the_Frenzied_Brute"]},{"id":"bifeng","name":"橫刀：畢峰","en":"Bi Feng, Giant Saber Commander","at":"枷籠山:14","main":true,"tips":["大部分普攻按住格擋即可，只對彩光招反應，用格擋加鬼步慢慢累積他的失衡。","轉兩圈後跳起的大劈砍是紅光：完美閃避後鬼步反擊；往正上方跳起也是紅光。","三連擊最後一下回身斬是藍光：招架，之後沒有追擊。","橫劈是黑光，格擋會清空殺氣；之後接彩光招。","⚠ 最危險的是肩撞抓取：微微後退蓄力再用左肩衝來，被抓幾乎必死，一定閃避。","斬擊範圍比看起來大，會邊跳開邊放劍氣；他放出的刀刃投射物可以招架。"],"reward":"巨刃（主武器）；真結局與獎盃「The Two Blade Masters」需要","hp":"135,180","src":["https://allthings.how/phantom-blade-zero-bi-feng-boss-fight/","https://phantombladezero.wiki.fextralife.com/Bi_Feng_Giant_Saber_Commander","https://game8.co/games/Phantom-Blade-Zero/archives/636869"]},{"id":"kuiyanyan","name":"瘋婆子奎艷艷","en":"Kui Yanyan, The Deranged","at":"枷籠山:21","main":true,"reward":"升降梯手柄、殺氣琥珀碎片","tips":["開場有兩名伏擊的面具敵人，先殺掉；重試時先清掉就不會再出現。","四連擊：兩下下砸、一下橫掃、最後紅光下劈——在最後一下閃避接鬼步。","閃紅光衝過來後接不可格擋的上挑，看到紅光就準備閃。","棍擊連段第三下可能是藍光，可以招架。","有三招黑光（其中一招是快速拉近的跳擊）：不要硬擋。","原地轉三圈後把你擊飛，退出範圍；她丟的匕首可以格擋。"],"hp":"120,160","src":["https://game8.co/games/Phantom-Blade-Zero/archives/637040","https://phantombladezero.wiki.fextralife.com/Kui_Yanyan_the_Deranged"]},{"id":"ironmask","name":"鐵面刺客","en":"Ironmask Assassin","at":"枷籠山:25","main":false,"tips":["⚠ 觸發：拿回贖罪名單交給鐵面人，對話選「這不能洗清你的罪孽」就會開戰；選另一個選項不會開戰，也會失去白雪兒路線。","名單在宗祠外山門鈴鐺下方的路線上，要先打過奎艷艷。","多個攻略都說這是比較簡單的戰鬥。"],"note":"找不到招式資料。","reward":"後街庭院鑰匙（開龐鎮後街的門，#106–108）","src":["https://beebom.com/how-to-get-backstreet-courtyard-key-in-phantom-blade-zero/"]},{"id":"jadeface","name":"玉面郎君","en":"Jade-Face","at":"枷籠山:32","main":true,"reward":"無縫之死（主武器）；任務推進到荒行子","tips":["先清掉金面、鐵面兩名護衛（血量少）；之後牠們會變成玉面郎君招式的一部分再出現。","他用鬼步消失時，鐵面、金面各打一下，最後玉面補一記藍光：招架。","四連遠程投擲後會瞬移，接著出藍光；沒招架到會再補一發遠程。","沒有面具在場時，他會瞬移到你身邊打黑光，不要硬擋。","貼身打比較容易破防；別站在面具和他中間，也別被逼到樓梯或欄杆邊，地上的環刃也會傷人。"],"hp":"139,680","src":["https://allthings.how/phantom-blade-zero-jade-face-boss-fight/","https://phantombladezero.wiki.fextralife.com/Jade-Face"]},{"id":"huangxing","name":"崑崙叛教者：荒行子","en":"Huangxing, The Kunlun Renegade","at":"枷籠山:35","main":true,"tips":["⚠ 開場追蹤你的落影加頭頂投擲是紅光，可能一擊秒殺：一定完美閃避接鬼步。","黑光頭頂斬要閃避；破防後的盾衝或快速紅光同樣閃避。","地砸和跳躍落下的血滴子是藍光：招架；旋轉投擲可招架，不然整段閃開。","左手往後拉＝沒有閃光的套索抓取，會吸乾殺氣，要閃；血滴子蓄力砸下時可以爬上場上柱子躲開，再接跳擊。","二階段左右衝刺約三次，最後一下紅光，在第三次衝刺時反擊；身體往後彎是不可打斷的衝撞，側移。","二階段黑暗期大部分攻擊可擋，看到淡白光就閃；畫面變亮後準備招架高跳攻擊。"],"reward":"飛天血滴子影之武裝（可開啟各地上鎖區域）","hp":"139,680 → 旋轉劊子手 155,200","src":["https://allthings.how/phantom-blade-zero-huangxing-boss-fight/","https://phantombladezero.wiki.fextralife.com/Huangxing_the_Kunlun_Renegade","https://game8.co/games/Phantom-Blade-Zero/archives/636602"]},{"id":"yuding","name":"十二號·偃月刀偶「玉鼎」","en":"Yuding, No. 12 Crescent Blade Puppet","at":"戲夢山莊:21","main":true,"reward":"偃月刀（雙手武器）、90,000 意識塵埃","note":"各來源對可否招架的說法有矛盾。","tips":["她要等校場五波敵人清完才會出現；死亡後已清的波數會保留。","大部分揮砍可以格擋，但每一下都很耗殺氣，注意殺氣條。","被風推開後她會延遲一下再橫掃全場放能量波（紅光）：站到她身後或完美閃避。","青綠色大能量波可以貼身側閃穿過去，完全不吃傷害，再繞背反擊。","跳躍時有紅光的那招被打中會進入長動畫，最後接秒殺的殺氣斬，要閃避。","⚠ 剩約 1/4 血會出跳躍紅光（勾頸處決）：一律閃避（Fextralife 說反擊成功可直接處決她，但風險高）。"],"hp":"170,720","src":["https://allthings.how/phantom-blade-zero-yuding-boss-fight/","https://game8.co/games/Phantom-Blade-Zero/archives/636973","https://phantombladezero.wiki.fextralife.com/Yuding_No._12_Crescent_Blade_Puppet"]},{"id":"qiufeng","name":"赤影骨刃：囚鋒","en":"Qiu Feng, The Crimson Boneblade","at":"戲夢山莊:30","main":true,"reward":"鬼面（飾品：招架或完美閃避觸發鬼步時召喚三個面具自動攻擊）","tips":["大部分攻擊按住格擋即可，只對少數彩光收尾招反應。","面具劍連段要招架；沒招架到的話第三下是黑光雙斬，接著是擊退的紅光。","藍光閃一下後撲到你的位置：招架；雙匕首連段最後的藍光也招架。","紅光閃一下後用面具棍重砸並炸開紅光（會重複幾次）：不能招架，只能閃。","畫面變黑白＝旋身加殺氣頭擊，馬上閃；身邊紅環旋轉或黑紅放射攻擊時遠離。","四連遠程飛刃最後一下閃紅光，在那一下完美閃避就能反擊；破防後他召喚巨面吸血、地面爆骨，拉開距離。"],"hp":"144,180","src":["https://allthings.how/phantom-blade-zero-qiu-feng-boss-fight/","https://game8.co/games/Phantom-Blade-Zero/archives/636956"]},{"id":"moyuan","name":"暗魔天堡之主：魔淵","en":"Mó Yuan","at":"戲夢山莊:36","main":false,"tips":["第五根龍柱試煉，也是血脈覺醒的最後一關。","藍白閃光＝高跳空襲：招架。","紅光掃過畫面＝要升空，空中來的那一擊要閃避。","他幾秒內就能衝過整個場地，退開只換得到很短的喘息；有些招會擊倒你再從上方追擊。","剩極低血量時頭上出現白色互動提示，按下即可處決結束試煉。"],"note":"魔淵在哪根龍柱，三個來源說法不同（悲泣溪谷／梅谷湖／戲夢山莊），本攻略依 PBZH 放在戲夢山莊第五龍柱。","hp":"223,200","reward":"魔堡面具（黑傷鑄魂材料）；完成血脈覺醒","src":["https://allthings.how/phantom-blade-zero-mo-yuan-boss-fight/","https://phantombladezero.wiki.fextralife.com/Mo_Yuan_Leader_of_the_Bastion_of_Mo"]},{"id":"leidang","name":"「虎炮」：雷當","en":"Lei Dang, The Tiger Cannon","at":"戲夢山莊:54","main":true,"tips":["一階段蓄力炮瞄準後不追蹤：看到長紅色瞄準線就側閃再繞背；虎口閃光＝要開炮。","踢開你之後常接黑光炮拳，接著馬上是紅光（往後開炮借力躍起空襲）要閃；跳躍紅光後會再跳兩次，最後一下藍光要招架。","沒架炮時連段第三下是藍光，招架可打斷吸殺氣的跳躍連段；他側步時別貼著，後面接抓取和近距離轟擊。","黑光跳擊落地後還有延遲爆炸，只閃第一下不夠。","二階段刺青發光時的紅光抓取會按住連打，要閃；跺腳震波有延遲餘震、可能召喚土柱；肩撞後的跳躍斧踢是藍光，招架。","⚠ 約 60% 血用「萬物歸塵」跳上天再砸下，傷害極高：站到離落點最遠的一端；先利用他的攻擊打掉場上土柱，可降低他用這招的機率。"],"reward":"虎炮影之武裝（可炸開脆弱石牆）","hp":"166,590 → 獨臂虎 185,100","src":["https://allthings.how/phantom-blade-zero-lei-dang-boss-fight/","https://phantombladezero.wiki.fextralife.com/Lei_Dang_One-Armed_Tiger","https://game8.co/games/Phantom-Blade-Zero/archives/637025"]},{"id":"crusher","name":"力者和鋸者","en":"The Crusher and The Saw","at":"斷魂山:13","main":true,"hp":"185,100","tips":["⚠ 開打前完成「小翠」，否則拿不到白山頭帶（#14）。","紅光重擊（手臂、鎖鏈發紅）和鋸者長槍突刺（槍身紅光）：一律閃，不要招架。","球砸地揚起雪霧，巨人隱身 2–3 秒，先拉開距離。","二階段巨人破冰獨自作戰：更兇但更脆，新增貼地拖球。"],"reward":"骨鋸；白山頭帶（需小翠）","src":["https://allthings.how/phantom-blade-zero-crusher-and-the-saw-boss-fight/"]},{"id":"lengtu","name":"夢差：冷荼","en":"Leng Tu","at":"斷魂山:18","main":true,"tips":["在斷魂崖鈴鐺之後的雪路上，是連戰的第四關，打完緊接夢華。","開打前要先清人偶車輪戰（會有金色盟友幫忙）；Fextralife 說四波都清完他才會受傷。","紅絲攻擊會黏在身上持續吸血，要把他打到破防才會解除。","倒吊噴出的混沌火錐可以招架或閃避穿過；結手印放出的追蹤火球沒有顏色，一路閃避穿過。","巨型人偶手橫掃要閃；後期地上紅色區域要避開。","第一次掉到 50% 以下會爆炸回滿血，之後獨臂雷當會加入幫你；本體血量偏低，可積極用爆發技速殺。"],"note":"各來源的小怪波次順序不一致。中文來源：結局分歧在開打冷荼時決定，開打前存檔。","hp":"83,295（本體）","reward":"無獨立獎勵","src":["https://allthings.how/phantom-blade-zero-leng-tu-boss-fight/","https://phantombladezero.wiki.fextralife.com/Leng_Tu_Herald_of_the_Veil"]},{"id":"menghua","name":"救苦救難夢華聖母娘娘","en":"Meng Hua, The Merciful Lady of the Blossom Veil","at":"斷魂山:18","main":true,"hp":"185,100","tips":["開場四道雷射繞場收束到她腳下，不能招架也閃不過：站進四個移動中的紅圈裡；之後地上的紅圈代表會落光柱，要離開。","召喚紅色閃電（落雷）時是藍光：完美招架。","用扇子擋住後先放紅光束再放藍色火球：招架火球可反彈到她身上打斷套路；其他扇子連段大多可招架，結束後貼上去。","冰盾讓她霸體，這時常雙扇齊擲（紅光）要閃；蓄白球、畫面變暗後接紅光，立刻完美閃避。","懸浮扇圈與三顆扇包火球會延遲爆炸：招架或閃開；她升空收集黑焰時遠離，滅世大招時優先撿地上的黑色碎片，不要繼續輸出。","50% 血時虛空加入與她對轟，兩人卡在動畫裡可以盡情輸出；10% 以下會放緩慢的彼岸花光束，注意站位。"],"reward":"聖母之扇（雙持）、聖母之冠、使者殘留絲線（傀儡師鈴鑄魂材料）","note":"紅色光矛與藍色冰波該招架或閃避，找不到明確來源。","src":["https://phantombladezero.wiki.fextralife.com/Meng_Hua_the_Merciful_Lady_of_the_Blossom_Veil","https://game8.co/games/Phantom-Blade-Zero/archives/637271","https://allthings.how/phantom-blade-zero-meng-hua-boss-fight/"]},{"id":"zuoshang","name":"「組織」冥主：左殤","en":"Zuo Shang, The Order's Shadow Sovereign","at":"斷魂山:22","main":true,"hp":"一階 → 真龍之軀 240,630","tips":["真結局限定：打完夢華後在墜夢鈴鐺附近的金色光柱按互動鍵。","先在「舊宅幻影」鈴鐺休息，死亡後不用重看過場。","一階：起身時的金色光爆是開戰信號；鞭刃弧斬、延長刀身突刺、繞身插落的飛劍、跳斬、低位環掃。","二階真龍之軀：俯衝、光錐、水面光束、龍魂、月牙斬、擴散金環、落刃。","⚠ 俯衝後刀陣鎖定你時，必須按畫面上的白色互動提示，否則即死；結尾是刀劍對拼 QTE。"],"reward":"金烏、殘破龍軀、光明之心","src":["https://allthings.how/?p=327230"]}],"quests":[{"id":"triple","name":"三面混沌","en":"Triple Threat","cat":"異聞","start":"悲泣溪谷:3","steps":["聖母像裂縫雕像接取","中後期挑戰三張臉的詭異魔偶","完成後血色森林冰雪區才會出現玉琮"]},{"id":"fleshlily","name":"血肉花 <script>(function(){
'use strict';
const G=window.GUIDE, KEY='pbz_book_checks';
const SLUG={'悲泣溪谷':'weeping-creek-valley','血色森林':'crimson-forest','陸家村':'village-of-lu','龐鎮':'pangzhen','正道大營':'mandate-encampment','梅谷湖':'meigu-lake','枷籠山':'mountain-of-imprisonment','戲夢山莊':'mirage-estate-pangzhen','斷魂山':'mount-soulrend'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const filt={todo:false,miss:false};
try{Object.assign(filt,JSON.parse(localStorage.getItem('pbz_v12_filters')||'{}'))}catch(e){}

// ---- 索引 ----
const P={}; // 'region:n' -> point
for(const [r,v] of Object.entries(G.points)) for(const p of v.points){p.r=r;p.k=v.key+':'+p.n;P[r+':'+p.n]=p}
const bossAt={}, bossNoAt={};
G.bosses.forEach(b=>{if(b.at)(bossAt[b.at]=bossAt[b.at]||[]).push(b);else(bossNoAt[b.ch]=bossNoAt[b.ch]||[]).push(b)});
const qStart={};G.quests.forEach(q=>{if(q.start)(qStart[q.start]=qStart[q.start]||[]).push(q)});
const ptCh={}, bossCh={};
G.chapters.forEach(ch=>{ch.keys=[];const walk=bl=>bl.forEach(b=>{if(b.t==='pts')for(let n=b.a;n<=b.b;n++){const id=b.r+':'+n;ptCh[id]=ch.id;ch.keys.push(P[id].k);(bossAt[id]||[]).forEach(x=>bossCh[x.id]=ch.id)}else if(b.t==='step')ch.keys.push(b.k)});walk(ch.intro);ch.segs.forEach(s=>walk(s.blocks))});

const prog=keys=>{const d=keys.filter(k=>S[k]).length;return[d,keys.length]};
const bar=(d,n)=>`<div class="bar"><i style="width:${n?d/n*100:0}%"></i></div><div class="barlbl">${d} / ${n}</div>`;

// ---- 元件 ----
function bossCard(b){
  const tips=(b.tips||[]).map(t=>`<li>${esc(t)}</li>`).join('');
  return `<details class="boss" id="boss-${b.id}"><summary><span style="font-size:22px">⚔</span><span><div class="bt">${b.main?'主線 BOSS':'可選 BOSS'}${b.hp?' · HP '+esc(b.hp):''}</div><div class="bn">${esc(b.name)}</div><div class="be">${esc(b.en)}</div></span></summary><div class="bd">${tips?`<ul>${tips}</ul>`:''}${b.note?`<div class="todo">${esc(b.note)}</div>`:''}${b.reward?`<div class="meta">🎁 ${esc(b.reward)}</div>`:''}${(b.src||[]).length?`<div class="src">來源：${b.src.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(' ')}</div>`:''}<label class="meta" style="display:block;margin-top:8px"><input type="checkbox" data-k="v12:boss:${b.id}" ${S['v12:boss:'+b.id]?'checked':''}> 已擊敗</label></div></details>`;
}
function point(p){
  const id=p.r+':'+p.n, ok=!!S[p.k];
  const qs=(qStart[id]||[]).map(q=>`<span class="badge b-q" data-q="${q.id}">📜 ${esc(q.name)}</span>`).join('');
  const bellEn=p.type==='鈴鐺'?(p.en||'').replace(/^Bell \((.*)\).*$/,'$1'):'';
  const icon=p.type==='鈴鐺'?'🔔 ':'';
  const nameHtml=p.zh?esc(icon+p.zh)+(p.zhGuess?' <span class="badge guess">暫譯</span>':''):(bellEn?esc(icon+bellEn):'');
  return `${(bossAt[id]||[]).map(bossCard).join('')}<div class="pt${p.miss?' miss':''}${ok?' ok':''}" id="p-${esc(p.r)}-${p.n}" data-miss="${p.miss?1:0}"><input type="checkbox" data-k="${esc(p.k)}" ${ok?'checked':''} aria-label="${esc(p.r)} #${p.n}"><div><div class="top"><span class="num">${esc(p.r)} #${p.n}</span><span class="ty t-${esc(p.type)}">${esc(p.type)}</span>${p.chest?'<span class="badge b-chest">寶箱</span>':''}${p.miss?'<span class="badge b-miss">⚠ 易錯過</span>':''}${qs}${nameHtml?`<span class="nm">${nameHtml}</span>`:''}</div><div class="hint">${esc(p.hint)}</div><div class="en">${esc(p.en||'')}${p.en?' · ':''}<a href="${esc(p.link||`https://www.powerpyx.com/phantom-blade-zero-${SLUG[p.r]}-collectible-locations/`)}" target="_blank" rel="noopener">看原圖 #${p.n} ↗</a></div></div></div>`;
}
function block(b){
  switch(b.t){
    case 'p':return `<p class="p">${esc(b.s)}</p>`;
    case 'warn':return `<div class="warn">⚠ ${esc(b.s)}</div>`;
    case 'tip':return `<div class="tip">💡 ${esc(b.s)}</div>`;
    case 'step':return `<div class="step${S[b.k]?' ok':''}"><input type="checkbox" data-k="${esc(b.k)}" ${S[b.k]?'checked':''}><div>${esc(b.s)}</div></div>`;
    case 'pts':{let h='';for(let n=b.a;n<=b.b;n++)h+=point(P[b.r+':'+n]);return h}
  }return '';
}
function segKeys(s){const k=[];s.blocks.forEach(b=>{if(b.t==='pts')for(let n=b.a;n<=b.b;n++)k.push(P[b.r+':'+n].k);else if(b.t==='step')k.push(b.k)});return k}

// ---- 頁面 ----
const view=document.getElementById('view');
function chapterPage(ch){
  const i=G.chapters.indexOf(ch),[d,n]=prog(ch.keys);
  const extra=bossNoAt[ch.short]||[];
  let h=`<div class="kicker">${esc(ch.en)}</div><h1>${esc(ch.title)}</h1>${bar(d,n)}${ch.intro.map(block).join('')}${extra.map(bossCard).join('')}`;
  ch.segs.forEach((s,si)=>{const[a,b]=prog(segKeys(s));h+=`<section class="seg" id="${ch.id}-s${si}"><h2><span>${esc(s.title)}</span><span class="pc">${a}/${b}</span></h2>${s.blocks.map(block).join('')}</section>`});
  const prev=G.chapters[i-1],next=G.chapters[i+1];
  h+=`<div class="navbtns">${prev?`<button data-go="${prev.id}">← ${esc(prev.title)}</button>`:'<span></span>'}${next?`<button data-go="${next.id}">${esc(next.title)} →</button>`:''}</div>`;
  return h;
}
function bossPage(){
  let h=`<div class="kicker">BOSS INDEX</div><h1>Boss 圖鑑</h1><p class="p">依劇情順序。點名稱跳到攻略中的位置；「打法資料待補」表示目前找不到可靠的具體打法。HP 為 Pathbreaker 難度（allthings.how）。</p>`;
  const done=G.bosses.filter(b=>S['v12:boss:'+b.id]).length;h+=bar(done,G.bosses.length);
  let last='';G.chapters.forEach(ch=>{const bs=G.bosses.filter(b=>bossCh[b.id]===ch.id||(!b.at&&(b.ch===ch.short)));if(!bs.length)return;h+=`<section class="seg"><h2><span>${esc(ch.title)}</span></h2>${bs.map(b=>`<div data-jump="boss-${b.id}" data-ch="${ch.id}" class="res"><b>${esc(b.name)}</b> <small>${b.main?'主線':'可選'} · ${esc(b.en)}${S['v12:boss:'+b.id]?' · ✅':''}</small></div>`).join('')}</section>`});
  return h;
}
function questPage(){
  const cats=['異聞','收集','迷局'];
  let h=`<div class="kicker">TALES</div><h1>支線總表</h1><p class="p">中文名依遊民星空等中文攻略用語，括號為英文（PowerPyx）。「迷局」是真結局相關任務。PowerPyx 列 36 篇支線，其內文寫 32 篇，以遊戲日誌為準。</p>`;
  cats.forEach(c=>{const qs=G.quests.filter(q=>q.cat===c);h+=`<section class="seg"><h2><span>${c}${c==='迷局'?'（真結局）':''}</span><span class="pc">${qs.filter(q=>S['v12:q:'+q.id]).length}/${qs.length}</span></h2>`;
    qs.forEach(q=>{h+=`<div class="card" id="q-${q.id}"><label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" data-k="v12:q:${q.id}" ${S['v12:q:'+q.id]?'checked':''}><span><h3>${esc(q.name)} <span class="en">${esc(q.en)}</span></h3></span></label>${q.start?`<div class="qcat">接取：<a href="#" data-jump="p-${esc(q.start.replace(':','-'))}" data-ch="${ptCh[q.start]}">${esc(q.start.replace(':',' #'))}</a></div>`:''}${q.miss?`<div class="warn">⚠ ${esc(q.miss)}</div>`:''}${q.note?`<div class="todo en">${esc(q.note)}</div>`:''}<ol>${(q.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`});h+='</section>'});
  return h;
}
function endingPage(){return `<div class="kicker">ENDINGS</div><h1>結局與真結局條件</h1>
<div class="warn">⚠ 中英文來源對結局條件的說法不一致。最保險的做法：<b>兩邊的條件都做完</b>，並在「青蛇屋往戲夢山莊前」與「最後的挽回之地鈴鐺」各留一個手動存檔。</div>
<section class="seg"><h2><span>英文來源（PowerPyx）</span></h2>
<p class="p">兩種結局：普通與真結局。真結局在普通最終 Boss 夢華之後追加左殤戰。</p>
<ol><li>進戲夢山莊（龐鎮青蛇屋往前）之前完成 10 個迷局任務：溪谷深處、虛空幻象、機關船、浮華引、幻術琵琶、崑崙三傑、泣聲何來、夢差幻境、紅房子、湖心秘密。</li><li>戲夢山莊完成第五根龍柱，結算「血脈覺醒」（五根龍柱全破）。</li><li>斷魂山「最後的挽回之地」鈴鐺之後鎖定結局。</li></ol></section>
<section class="seg"><h2><span>中文來源（phantombladezero.help／18183／OSLink）</span></h2>
<p class="p">結局在<b>挑戰夢差：冷荼時</b>決定：</p>
<table><tr><th>結局</th><th>條件</th></tr><tr><td>決戰（真結局）</td><td>完成湖心秘密（含與虛空對話）＋五根龍柱全勝</td></tr><tr><td>龍之咆哮／龍吟</td><td>完成湖心秘密，但龍柱未全勝</td></tr><tr><td>湮滅</td><td>未完成湖心秘密</td></tr><tr><td>飲恨</td><td>六十六天計時模式（NG+）時間用完</td></tr></table>
<p class="p">PBZH 列的九項前置：全部紫色任務、兩顆水晶人偶眼珠（紅房子、枷籠山）、4 個滅法面具（寒歲、炎茹、雷婷、古河）、修好幻術琵琶、血脈覺醒（第五龍柱對手魔淵）、眼珠放進梅谷湖鏡界、湖心秘密、妙手小張全線、擊敗夢華。</p>
<div class="tip">💡 OSLink 有一則說法是「清完五根龍柱可能鎖結局」，與其他來源矛盾，暫不採信。結局總數各來源也不同（2 種～製作人提過 8 種）。</div></section>
<section class="seg"><h2><span>兩個無法回頭的點</span></h2><ol><li>龐鎮青蛇屋鈴鐺附近選「決意繼續前進！」：進戲夢山莊，血色森林冰雪化，5 個鈴鐺永久關閉（需重開）。</li><li>戲夢山莊靈堂附近破牆前進：之後無法回其他區域，進入斷魂山。</li><li>斷魂山「最後的挽回之地」鈴鐺：鎖定結局路線。</li></ol></section>`}
function statsPage(){
  const regs=Object.keys(G.points);let h=`<div class="kicker">PROGRESS</div><h1>收集進度</h1><div class="grid">`;
  const all=Object.values(P);const[d,n]=prog(all.map(p=>p.k));h+=`<div class="stat"><b>${d}/${n}</b>全部點位</div>`;
  regs.forEach(r=>{const ps=G.points[r].points;const[a,b]=prog(ps.map(p=>G.points[r].key+':'+p.n));h+=`<div class="stat"><b>${a}/${b}</b>${esc(r)}</div>`});
  h+=`</div><section class="seg"><h2><span>依類型</span></h2><table><tr><th>類型</th><th>已完成</th><th>總數</th></tr>`;
  const ty={};all.forEach(p=>{(ty[p.type]=ty[p.type]||[]).push(p.k)});Object.entries(ty).sort((a,b)=>b[1].length-a[1].length).forEach(([t,ks])=>{const[a,b]=prog(ks);h+=`<tr><td>${esc(t)}</td><td>${a}</td><td>${b}</td></tr>`});
  h+=`</table><p class="p" style="font-size:13px;color:var(--muted)">612 個點位對應 PowerPyx 各區編號，包含支線條目；PowerPyx 總覽的「573 個收集位置」不含支線。寶箱標記是從路線說明辨識（共 ${all.filter(p=>p.chest).length} 處），不是官方寶箱總數——目前中英文來源都沒有逐區寶箱數。</p></section>`;
  const miss=all.filter(p=>p.miss&&!S[p.k]);h+=`<section class="seg"><h2><span>尚未處理的易錯過項目</span><span class="pc">${miss.length}</span></h2>${miss.map(p=>`<div class="res" data-jump="p-${esc(p.r)}-${p.n}" data-ch="${ptCh[p.r+':'+p.n]}"><b>${esc(p.r)} #${p.n}</b> <small>${esc(p.hint.slice(0,60))}…</small></div>`).join('')}</section>`;
  return h;
}
function aboutPage(){return `<div class="kicker">ABOUT</div><h1>關於這本攻略</h1>
<p class="p">版本 V12（${esc(G.meta.date)}）。依劇情順序整理：每章依路線列出鈴鐺、寶箱、收集品、支線接取與交付、Boss 打法與不可逆警告；後期解鎖的回訪點放在可以拿的時間點。</p>
<section class="seg"><h2><span>資料來源</span></h2><ul>
<li>點位與路線：<a href="https://www.powerpyx.com/phantom-blade-zero-collectibles-guide-100-completion/" target="_blank" rel="noopener">PowerPyx 全收集</a>、<a href="https://www.powerpyx.com/phantom-blade-zero-all-side-quests-guide/" target="_blank" rel="noopener">全支線</a>、<a href="https://www.powerpyx.com/phantom-blade-zero-true-ending-guide/" target="_blank" rel="noopener">真結局</a></li>
<li>中文名稱與流程：<a href="https://www.gamersky.com/handbook/Special/dbzero/" target="_blank" rel="noopener">遊民星空</a>、<a href="https://www.3dmgame.com/gl/3993074.html" target="_blank" rel="noopener">3DM</a>、<a href="https://www.phantombladezero.help/zh-hant/guide" target="_blank" rel="noopener">phantombladezero.help</a></li>
<li>Boss 打法：allthings.how 各 Boss 頁、<a href="https://www.18183.com/gonglue/202610/9073424.html" target="_blank" rel="noopener">18183</a>、method.gg</li></ul>
<p class="p">中文名稱取自簡體中文攻略轉繁體，未必與遊戲繁中介面逐字相同；每條都附英文原名方便搜尋。以 PS5 版為準，遊戲版本 1.302.289（2026-11-04 更新：新娘阿花抓取頻率降低、Boss 微調，無新增內容）。按鍵提示寫「互動鍵」等通用說法，以遊戲畫面為準。</p></section>
<section class="seg"><h2><span>進度</span></h2><p class="p">勾選存在這台裝置。換裝置請用側欄 ⚙︎ 的「匯出／匯入進度」。V11 的點位勾選會自動沿用。</p><button class="chip" id="clearAll">清空所有勾選</button></section>`}

function trophyPage(){
  const T=G.trophies,k=i=>'v12:t:'+T[i].en;
  let h=`<div class="kicker">PS5 TROPHIES</div><h1>PS5 白金獎盃</h1><p class="p">共 ${T.length} 項（1 白金、3 金、14 銀、18 銅）。標 ⚠ 的會因錯過支線或沒走真結局而失效，一輪白金就照本攻略的截止提醒做。Boss 類獎盃點名稱可跳到打法卡。</p>`;
  const[d,n]=prog(T.map((_,i)=>k(i)));h+=bar(d,n);
  const cats=[...new Set(T.map(t=>t.cat))];
  cats.forEach(c=>{h+=`<section class="seg"><h2><span>${esc(c)}</span></h2>`;T.forEach((t,i)=>{if(t.cat!==c)return;const ok=!!S[k(i)];const b=t.boss&&G.bosses.find(x=>x.id===t.boss);
    h+=`<div class="step${ok?' ok':''}" data-miss="${t.miss?1:0}"><input type="checkbox" data-k="${esc(k(i))}" ${ok?'checked':''}><div><b>${esc(t.en)}</b> ${t.miss?'<span class="badge b-miss">⚠ 易錯過</span>':''}<div class="hint">${b?`<a href="#" data-jump="boss-${b.id}" data-ch="${bossCh[b.id]||''}">${esc(t.how)}</a>`:esc(t.how)}</div><div class="en">${esc(t.where)}</div></div></div>`});h+='</section>'});
  return h+'<p class="p" style="font-size:12px;color:var(--muted)">獎盃名稱依 PowerPyx、TrueTrophies 對照；中文說明為意譯。</p>';
}
const PAGES={boss:['Boss 圖鑑',bossPage],quests:['支線總表',questPage],trophies:['PS5 獎盃',trophyPage],endings:['結局條件',endingPage],stats:['收集進度',statsPage],about:['關於／來源',aboutPage]};

// ---- 導覽 ----
const nav=document.getElementById('nav');
function renderNav(cur){
  let h='<div class="grp">攻略路線</div>';
  G.chapters.forEach(ch=>{const[d,n]=prog(ch.keys);h+=`<button data-go="${ch.id}" class="${cur===ch.id?'on':''}${n&&d===n?' done':''}"><span>${esc(ch.navTitle)}</span><span class="pc">${n?Math.round(d/n*100)+'%':''}</span></button>`});
  h+='<div class="grp">圖鑑與工具</div>';
  for(const [id,[t]] of Object.entries(PAGES))h+=`<button data-go="${id}" class="${cur===id?'on':''}"><span>${t}</span></button>`;
  nav.innerHTML=h;
}
let cur=null;
function go(id,anchor){
  let ch=G.chapters.find(c=>c.id===id);
  if(!ch&&!PAGES[id]){ch=G.chapters[0];id=ch.id;anchor=null}
  cur=id;
  view.innerHTML=ch?chapterPage(ch):PAGES[id][1]();
  applyFilters();renderNav(id);
  if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);
  try{localStorage.setItem('pbz_v12_last',id)}catch(e){}
  if(anchor){const el=document.getElementById(anchor);if(el){if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({block:'center'});el.classList.add('flash')}}
  else scrollTo(0,0);
  const on=nav.querySelector('.on');on&&on.scrollIntoView({block:'nearest',inline:'center'});
}
function applyFilters(){
  document.querySelectorAll('#fTodo').forEach(b=>b.classList.toggle('on',filt.todo));
  document.querySelectorAll('#fMiss').forEach(b=>b.classList.toggle('on',filt.miss));
  view.querySelectorAll('.pt,.step').forEach(el=>{const ok=el.classList.contains('ok');const m=el.dataset.miss==='1';el.classList.toggle('hidden',(filt.todo&&ok)||(filt.miss&&!m))});
  view.querySelectorAll('.p,.tip').forEach(el=>el.classList.toggle('hidden',filt.miss));
}

// ---- 事件 ----
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;S[k]=e.target.checked;if(!e.target.checked)delete S[k];save();
  const row=e.target.closest('.pt,.step');row&&row.classList.toggle('ok',e.target.checked);
  const seg=e.target.closest('.seg');if(seg&&cur&&G.chapters.find(c=>c.id===cur)){const ch=G.chapters.find(c=>c.id===cur);const si=+seg.id.split('-s')[1];const[a,b]=prog(segKeys(ch.segs[si]));seg.querySelector('h2 .pc').textContent=a+'/'+b;const[d,n]=prog(ch.keys);view.querySelector('.bar i').style.width=(d/n*100)+'%';view.querySelector('.barlbl').textContent=d+' / '+n}
  renderNav(cur);if(filt.todo&&row)setTimeout(applyFilters,600)});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);document.getElementById('q').value='';return}
  const j=e.target.closest('[data-jump]');if(j){e.preventDefault();go(j.dataset.ch,j.dataset.jump);return}
  const q=e.target.closest('[data-q]');if(q){go('quests','q-'+q.dataset.q);return}
  if(e.target.id==='clearAll'&&confirm('確定清空所有勾選？此動作無法復原（建議先匯出進度）。')){S={};save();go(cur)}
  if(e.target.id==='fTodo'){filt.todo=!filt.todo;saveF();applyFilters()}
  if(e.target.id==='fMiss'){filt.miss=!filt.miss;saveF();applyFilters()}
  if(e.target.id==='fOpen'){const ds=[...view.querySelectorAll('details.boss')];const open=!ds.every(d=>d.open);ds.forEach(d=>d.open=open)}
});
const saveF=()=>{try{localStorage.setItem('pbz_v12_filters',JSON.stringify(filt))}catch(e){}};
// 搜尋
const qi=document.getElementById('q');let qt;
qi.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(search,200)});
function search(){
  const s=qi.value.trim().toLowerCase();if(!s){go(cur||G.chapters[0].id);return}
  const out=[];
  G.bosses.forEach(b=>{if((b.name+b.en+(b.tips||[]).join('')).toLowerCase().includes(s))out.push(`<div class="res" data-jump="boss-${b.id}" data-ch="${bossCh[b.id]||''}"><b>⚔ ${esc(b.name)}</b> <small>${esc(b.en)}</small></div>`)});
  G.quests.forEach(q=>{if((q.name+q.en+(q.steps||[]).join('')).toLowerCase().includes(s))out.push(`<div class="res" data-q="${q.id}"><b>📜 ${esc(q.name)}</b> <small>${esc(q.en)}</small></div>`)});
  Object.values(P).forEach(p=>{if((p.hint+p.en+p.zh+p.type).toLowerCase().includes(s))out.push(`<div class="res" data-jump="p-${esc(p.r)}-${p.n}" data-ch="${ptCh[p.r+':'+p.n]}"><b>${esc(p.r)} #${p.n}</b> <span class="ty t-${esc(p.type)}">${esc(p.type)}</span> <small>${esc(p.hint.slice(0,70))}</small></div>`)});
  view.innerHTML=`<h1>搜尋「${esc(qi.value)}」</h1><p class="p">${out.length} 筆結果</p>${out.slice(0,200).join('')}`;
}
// 下一個未完成：目前章節的第一個未勾項目；本章完成就往後找有未完成的章節
function nextTodo(){
  const visible=()=>[...view.querySelectorAll('.pt:not(.ok),.step:not(.ok)')].find(el=>!el.classList.contains('hidden'));
  const isCh=G.chapters.some(c=>c.id===cur);
  let el=isCh&&visible();
  if(!el){
    const i=Math.max(0,G.chapters.findIndex(c=>c.id===cur));
    const order=G.chapters.slice(isCh?i+1:0).concat(G.chapters.slice(0,isCh?i+1:0));
    const ch=order.find(c=>c.keys.some(k=>!S[k]));
    if(!ch){toast('全部完成！🎉');return}
    if(filt.todo||filt.miss){filt.todo=false;filt.miss=false;saveF()}
    go(ch.id);el=visible();if(!el)return;
  }
  el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
}
function toast(t){const d=document.createElement('div');d.className='mini-toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const fab=document.createElement('button');fab.className='fab no-print';fab.id='fNext';fab.title='跳到下一個未完成';fab.innerHTML='▶<span>下一個未完成</span>';
fab.onclick=nextTodo;document.body.appendChild(fab);
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur)go(h)});
// 手機版：讓工具列貼在側欄下方
const fixNavH=()=>document.documentElement.style.setProperty('--navh',(innerWidth<=950?document.querySelector('.sidebar').offsetHeight:0)+'px');
addEventListener('resize',fixNavH);
let start=location.hash.slice(1);if(!start){try{start=localStorage.getItem('pbz_v12_last')}catch(e){}}
go(start||G.chapters[0].id);fixNavH();
})();
</script>
<script id="pwa-js">/* ===== PWA 外殼腳本（由 build.py 注入，2026.11.08-f7a500d 會被替換） ===== */
(function(){
  const VERSION='2026.11.08-f7a500d';
  const KEY='pbz_book_checks';
  const side=document.querySelector('.sidebar');
  if(!side) return;

  // --- 側欄工具盒 ---
  const box=document.createElement('div');
  box.className='pwa-box no-print';
  box.innerHTML=`
    <div><span class="pwa-net" id="pwaNet">● 已連線</span></div>
    <div class="pwa-row">
      <button class="pwa-btn gold" id="pwaInstall" hidden>⬇ 安裝 App</button>
      <button class="pwa-btn" id="pwaCheck">檢查更新</button>
    </div>
    <div class="pwa-ios" id="pwaIos">iPhone／iPad：Safari 分享 ⎋ →「加入主畫面」</div>
    <div class="pwa-row">
      <button class="pwa-btn" id="pwaExport">匯出進度</button>
      <button class="pwa-btn" id="pwaImport">匯入進度</button>
      <input type="file" id="pwaFile" accept="application/json,.json" hidden>
    </div>
    <div class="pwa-ver">版本 ${VERSION}</div>`;
  side.appendChild(box);

  const brand=side.querySelector('.brand');
  if(brand){
    const m=document.createElement('button');
    m.className='pwa-menu no-print';m.textContent='⚙︎';m.title='App 設定';
    m.onclick=()=>side.classList.toggle('pwa-open');
    brand.appendChild(m);
  }

  // --- 網路狀態 ---
  const net=document.getElementById('pwaNet');
  const setNet=()=>{const on=navigator.onLine;net.textContent=on?'● 已連線':'● 離線模式（可正常閱讀）';net.classList.toggle('off',!on)};
  addEventListener('online',setNet);addEventListener('offline',setNet);setNet();

  // --- 安裝 ---
  let deferred=null;const ib=document.getElementById('pwaInstall');
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;ib.hidden=false});
  ib.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;ib.hidden=true};
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone) document.getElementById('pwaIos').style.display='block';

  // --- 進度匯出／匯入（換裝置、換網址時用） ---
  document.getElementById('pwaExport').onclick=()=>{
    const data={app:'pbz-guide',version:VERSION,exported:new Date().toISOString(),checks:JSON.parse(localStorage.getItem(KEY)||'{}')};
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
    a.download=`影之刃零進度_${new Date().toISOString().slice(0,10)}.json`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  const file=document.getElementById('pwaFile');
  document.getElementById('pwaImport').onclick=()=>file.click();
  file.onchange=async()=>{
    const f=file.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());const inc=d.checks||d;
      if(typeof inc!=='object')throw 0;
      const cur=JSON.parse(localStorage.getItem(KEY)||'{}');
      const n=Object.keys(inc).length;
      if(!confirm(`匯入 ${n} 筆進度，與目前進度合併？`))return;
      localStorage.setItem(KEY,JSON.stringify(Object.assign(cur,inc)));
      location.reload();
    }catch(e){alert('檔案格式不正確')}
    file.value='';
  };

  // --- Service Worker 與更新提示 ---
  if(!('serviceWorker' in navigator)||location.protocol==='file:') {box.querySelector('#pwaCheck').hidden=true;return;}
  const toast=document.createElement('div');toast.className='pwa-toast no-print';
  toast.innerHTML='<span>攻略本有新版本</span><button class="pwa-btn gold">立即更新</button>';
  document.body.appendChild(toast);
  let waiting=null,reloading=false;
  const showUpdate=w=>{waiting=w;toast.classList.add('show')};
  toast.querySelector('button').onclick=()=>{if(waiting)waiting.postMessage('SKIP_WAITING')};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});

  navigator.serviceWorker.register('./sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(nw)});
    });
    const chk=document.getElementById('pwaCheck');
    chk.onclick=async()=>{chk.textContent='檢查中…';try{await reg.update()}catch(e){}
      setTimeout(()=>{chk.textContent=(reg.waiting||reg.installing)?'有新版本':'已是最新';setTimeout(()=>chk.textContent='檢查更新',2500)},1200)};
    // 從背景回到 App 時自動檢查
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  });
})();
</script></body></html>
